<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeitmanagement</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root {
      --bg: #101214;
      --surface: #16191d;
      --panel: #1d2127;
      --panel-2: #242932;
      --panel-3: #2a303a;
      --line: #373f4b;
      --line-soft: rgba(255, 255, 255, .07);
      --text: #f4f6f8;
      --muted: #aeb6c2;
      --muted-2: #7f8895;
      --pink: #f05379;
      --blue: #2388ff;
      --yellow: #ffd84d;
      --green: #45d483;
      --orange: #e9b949;
      --board-accent: #6f8295;
      --board-tint: 111, 130, 149;
      --shadow: 0 20px 60px rgba(0, 0, 0, .34);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(var(--board-tint), .13) 0, transparent 300px),
        var(--bg);
      background-size: auto, auto;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    button {
      min-height: 40px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      font-weight: 750;
      padding: 9px 13px;
      transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
    }
    button:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.18);
      background: #2b323d;
    }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid rgba(35, 136, 255, .85);
      outline-offset: 2px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(16, 18, 20, .92);
      padding: 22px 28px 18px;
      backdrop-filter: blur(18px);
    }
    .header-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      max-width: 1600px;
      margin: 0 auto;
    }
    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(30px, 4vw, 50px);
      font-weight: 850;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .color-palette {
      display: inline-flex;
      gap: 7px;
      align-items: center;
    }
    .color-palette button {
      width: 28px;
      min-width: 28px;
      min-height: 28px;
      border: 2px solid transparent;
      border-radius: 999px;
      background: var(--swatch);
      padding: 0;
    }
    .color-palette button.active {
      border-color: #f4f6f8;
      box-shadow: 0 0 0 2px rgba(255,255,255,.13);
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 10px;
    }
    .metric {
      min-width: 120px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
      padding: 11px 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 20px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      max-width: 1600px;
      margin: 20px auto 0;
    }
    .add {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border-color: rgba(35, 136, 255, .85);
      background: linear-gradient(180deg, #2d94ff, #176fd8);
      color: white;
      box-shadow: 0 12px 30px rgba(35, 136, 255, .25);
    }
    .add span {
      font-size: 25px;
      line-height: 0;
      font-weight: 400;
    }
    .secondary {
      background: rgba(255,255,255,.045);
      color: var(--text);
    }
    .icon-button {
      width: 42px;
      min-width: 42px;
      display: inline-grid;
      place-items: center;
      padding: 8px;
    }
    .icon-button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-button.active {
      border-color: var(--yellow);
      background: var(--yellow);
      color: #151515;
    }
    .svg-icon {
      width: 20px;
      height: 20px;
      display: inline-block;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.25;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: middle;
    }
    .switch {
      display: inline-grid;
      grid-template-columns: repeat(5, minmax(105px, 1fr));
      overflow: hidden;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .switch button {
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: #c9c9c4;
    }
    .switch button:last-child { border-right: 0; }
    .switch button.active {
      background: var(--yellow);
      color: #111;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.18);
    }
    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px 28px 38px;
    }
    .learning {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .learning > div, .panel {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(29, 33, 39, .82);
      padding: 14px 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
    }
    .learning span {
      color: var(--muted);
      font-weight: 800;
    }
    .learning strong { float: right; }
    .board {
      display: grid;
      grid-auto-columns: minmax(300px, 1fr);
      grid-auto-flow: column;
      gap: 14px;
      min-height: calc(100vh - 220px);
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .column {
      overflow: hidden;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(var(--board-tint), .075), rgba(22, 25, 29, .88) 150px);
      min-width: 300px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
    }
    .column-head {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line-soft);
      border-radius: var(--radius) var(--radius) 0 0;
      background: linear-gradient(180deg, rgba(var(--board-tint), .18), rgba(36, 41, 50, .96));
      padding: 13px 14px;
    }
    .column-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .01em;
    }
    .column-head span {
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: #d9d9d3;
      font-size: 12px;
      font-weight: 900;
      padding: 4px 8px;
    }
    .stack {
      display: grid;
      align-content: start;
      gap: 11px;
      min-height: 520px;
      padding: 12px;
    }
    .empty {
      border: 1px dashed rgba(255,255,255,.17);
      border-radius: var(--radius);
      color: #8f918e;
      font-size: 13px;
      font-weight: 800;
      padding: 18px;
      text-align: center;
      background: rgba(255,255,255,.025);
    }
    .card {
      position: relative;
      border: 1px solid rgba(255,255,255,.09);
      border-left: 5px solid var(--green);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(var(--board-tint), .11), transparent 90px), linear-gradient(180deg, #252a32, #1c2026);
      cursor: grab;
      padding: 14px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.24);
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.16);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.32);
    }
    .card.tight { border-left-color: var(--orange); }
    .card.critical, .card.late { border-left-color: var(--pink); }
    .card.done { border-left-color: #666; }
    .card.critical {
      box-shadow: 0 0 0 2px rgba(240, 79, 120, .22), 0 10px 24px rgba(0, 0, 0, .22);
    }
    .card.late {
      animation: urgentPulse 1.4s ease-in-out infinite;
    }
    @keyframes urgentPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(240, 79, 120, .5), 0 10px 24px rgba(0, 0, 0, .22); }
      50% { box-shadow: 0 0 0 4px rgba(240, 79, 120, .18), 0 10px 24px rgba(0, 0, 0, .22); }
    }
    .card-main {
      display: grid;
      gap: 12px;
    }
    .card-title-row {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }
    .card-title-row h3 {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      line-height: 1.06;
      letter-spacing: 0;
    }
    .deadline-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: #eef2f6;
      font-size: 12px;
      font-weight: 900;
      padding: 6px 9px;
      white-space: nowrap;
    }
    .card-focus {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: stretch;
    }
    .play-cluster {
      display: grid;
      gap: 5px;
      justify-items: center;
      align-content: center;
    }
    .time-left {
      border: 1px solid rgba(255,255,255,.1);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      padding: 10px 12px;
    }
    .time-left span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .time-left strong {
      display: block;
      margin-top: 4px;
      font-size: 28px;
      line-height: 1;
    }
    .play-button {
      min-width: 78px;
      min-height: 66px;
      border-color: rgba(56, 193, 114, .7);
      background: linear-gradient(180deg, #40d17c, #219653);
      color: white;
      font-size: 0;
      box-shadow: 0 14px 28px rgba(56, 193, 114, .18);
    }
    .play-button::before {
      content: "";
      display: inline-block;
      width: 0;
      height: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 18px solid currentColor;
      margin-left: 4px;
      vertical-align: middle;
    }
    .play-button.active {
      border-color: rgba(240, 79, 120, .8);
      background: linear-gradient(180deg, #ff6a8f, #d73562);
      color: white;
    }
    .play-button.active::before {
      width: 18px;
      height: 22px;
      border: 0;
      border-left: 6px solid currentColor;
      border-right: 6px solid currentColor;
      margin-left: 0;
    }
    .card-subline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .card-subline span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .card-subline .deadline-pill {
      margin-left: auto;
      color: #eef2f6;
    }
    .details-toggle {
      display: grid;
      place-items: center;
      min-height: 34px;
      border-color: rgba(255,255,255,.08);
      background: rgba(255,255,255,.035);
      color: var(--muted);
      font-size: 12px;
      padding: 6px 9px;
      text-align: center;
    }
    .details-toggle::before {
      content: "⌄";
      color: currentColor;
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
    }
    .card details {
      margin-top: 10px;
    }
    .card summary {
      list-style: none;
    }
    .card summary::-webkit-details-marker {
      display: none;
    }
    .card details[open] .details-toggle {
      color: var(--text);
      background: rgba(255,255,255,.07);
    }
    .card details[open] .details-toggle::before {
      content: "⌃";
    }
    .card-details {
      display: grid;
      gap: 10px;
      border-top: 1px solid rgba(255,255,255,.08);
      margin-top: 10px;
      padding-top: 10px;
    }
    .kicker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .kicker span {
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: #dce2e8;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
    }
    .card p {
      margin: 6px 0 0;
      color: var(--muted);
    }
    .risk, .timer-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 12px;
    }
    .risk div, .timer {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      padding: 9px;
    }
    .risk span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .risk strong, .timer strong {
      display: block;
      margin-top: 3px;
      font-size: 17px;
    }
    .timer {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
    }
    .timer.active {
      border-color: var(--yellow);
      background: rgba(255, 216, 77, .16);
      box-shadow: inset 0 0 0 1px rgba(255, 216, 77, .25);
    }
    .split-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .split-actions button {
      width: 100%;
      margin-top: 0;
    }
    .card-icon-button {
      display: grid;
      place-items: center;
      min-height: 42px;
      font-size: 20px;
      line-height: 1;
    }
    .folder { background: rgba(255,255,255,.06); }
    .delete-action {
      border-color: rgba(255,255,255,.08);
      background: rgba(255,255,255,.045);
      color: var(--muted);
    }
    .delete-action:hover, .delete-action:focus-visible {
      border-color: rgba(240, 83, 121, .6);
      background: rgba(240, 83, 121, .14);
      color: white;
    }
    .note {
      border-left: 3px solid var(--orange);
      margin-top: 12px;
      padding-left: 10px;
    }
    .timeline-panel, .analysis-panel {
      overflow-x: auto;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: #16191d;
      box-shadow: var(--shadow);
    }
    .panel-head {
      display: flex;
      min-width: 920px;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--line-soft);
      padding: 14px 16px;
    }
    .panel-head h2 {
      margin: 0;
      font-size: 20px;
    }
    .time-grid {
      display: grid;
      min-width: 920px;
      grid-template-columns: 220px minmax(680px, 1fr);
    }
    .time-label {
      min-height: 58px;
      border-right: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
      background: rgba(36, 41, 50, .8);
      padding: 10px 12px;
    }
    .time-label strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .time-label span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }
    .scale {
      display: grid;
      min-height: 44px;
      grid-template-columns: repeat(11, minmax(60px, 1fr));
      border-bottom: 1px solid var(--line-soft);
      background: #171b21;
    }
    .scale span {
      border-left: 1px solid var(--line-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      padding: 12px 8px;
    }
    .timeline-row { display: contents; }
    .track {
      position: relative;
      min-height: 58px;
      border-bottom: 1px solid var(--line-soft);
      background:
        repeating-linear-gradient(
          90deg,
          #171b21 0,
          #171b21 calc(10% - 1px),
          rgba(255,255,255,.07) calc(10% - 1px),
          rgba(255,255,255,.07) 10%
        );
    }
    .bar {
      position: absolute;
      top: 13px;
      min-width: 58px;
      height: 30px;
      overflow: hidden;
      border-radius: 6px;
      color: #07120c;
      font-size: 12px;
      font-weight: 900;
      line-height: 30px;
      padding: 0 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: var(--green);
      box-shadow: 0 10px 22px rgba(0,0,0,.24);
    }
    .bar.tight { background: var(--orange); color: #1f1603; }
    .bar.critical, .bar.late { background: var(--pink); color: white; }
    .pin {
      position: absolute;
      z-index: 2;
      top: 4px;
      border-left: 2px solid var(--text);
      color: var(--text);
      font-size: 11px;
      font-weight: 900;
      padding-left: 5px;
      white-space: nowrap;
    }
    .pin.send {
      top: auto;
      bottom: 4px;
      border-left-color: #58b8ff;
      color: #9dd7ff;
    }
    .now {
      position: absolute;
      inset: 0 auto 0 0;
      z-index: 1;
      width: 2px;
      background: #ffffff;
      box-shadow: 0 0 18px rgba(255,255,255,.55);
    }
    .analysis-summary {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .analysis-tools,
    .settings-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .analysis-tools input {
      min-width: min(360px, 100%);
      flex: 1;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      color: var(--text);
      padding: 10px 11px;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .settings-card {
      border: 1px solid #353535;
      border-radius: 8px;
      background: #1f1f1f;
      padding: 16px;
    }
    .settings-card h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    .settings-card p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.45;
    }
    .settings-card label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .settings-card input {
      width: 100%;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      color: var(--text);
      padding: 10px 11px;
    }
    .sync-status {
      min-height: 20px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .sync-status.ok { color: var(--green); }
    .sync-status.warn { color: var(--orange); }
    .sync-status.error { color: var(--pink); }
    .table { min-width: 980px; }
    .row {
      display: grid;
      grid-template-columns: minmax(220px, 1.4fr) repeat(6, minmax(110px, 1fr));
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid var(--line-soft);
      padding: 12px 16px;
    }
    .row:not(.head):hover {
      background: rgba(255,255,255,.035);
    }
    .row.head span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .row small {
      display: block;
      color: var(--muted);
      margin-top: 3px;
    }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      background: rgba(0,0,0,.72);
      padding: 20px;
      backdrop-filter: blur(10px);
    }
    .modal.open { display: grid; }
    .dialog {
      width: min(620px, 100%);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--radius);
      background: #20252d;
      padding: 20px;
      box-shadow: 0 28px 90px rgba(0,0,0,.48);
    }
    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .dialog h2 { margin: 0; }
    .form {
      display: grid;
      gap: 12px;
    }
    .form label, .form-field {
      display: grid;
      gap: 6px;
      color: #cbd3dd;
      font-size: 13px;
      font-weight: 800;
    }
    .form-field > span {
      display: block;
    }
    .form input, .form select, .form textarea {
      width: 100%;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      color: var(--text);
      padding: 10px 11px;
      outline: none;
    }
    .form input:focus, .form select:focus, .form textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(35, 136, 255, .2);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .slots {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .slot.active {
      border-color: var(--yellow);

      color: #111;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }
    .primary {
      border-color: #34d37c;
      background: linear-gradient(180deg, #45dc88, #1fa65c);
      color: white;
      box-shadow: 0 12px 28px rgba(31, 166, 92, .24);
    }
    .hint {
      color: var(--muted);
      font-size: 12px;
      margin: 12px 0 0;
    }
    .suggestion {
      display: none;
      border: 1px solid #51482a;
      border-radius: 8px;
      background: #2b2616;
      color: #ffe8a3;
      font-size: 13px;
      font-weight: 800;
      padding: 10px 11px;
    }
    .suggestion.visible { display: block; }
    @media (max-width: 900px) {
      .header-row { align-items: stretch; flex-direction: column; }
      .metrics, .learning, .analysis-summary, .grid-2, .settings-grid { grid-template-columns: 1fr; }
      .switch { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <div>
        <h1>Zeitmanagement</h1>
      </div>
      <div class="metrics" id="metrics"></div>
    </div>
    <div class="actions">
      <button class="add" id="openDialog"><span>+</span> Aufgabe hinzufügen</button>
      <div class="switch" aria-label="Ansicht wechseln">
        <button class="active" data-view="board">Kanban</button>
        <button data-view="timeline">Timeline</button>
        <button data-view="analysis">Analyse</button>
        <button data-view="archive">Archiv</button>
        <button data-view="settings">Einstellungen</button>
      </div>
      <button class="icon-button" id="notify" title="Benachrichtigungen aktivieren" aria-label="Benachrichtigungen aktivieren">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
          <path d="M10 21h4"></path>
        </svg>
      </button>
      <input id="csvFile" type="file" accept=".csv,.txt" hidden>
      <input id="backupFile" type="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <main>
    <section class="learning" id="learning"></section>
    <section id="view"></section>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Aufgabe hinzufügen">
    <div class="dialog">
      <div class="dialog-head">
          <h2 id="dialogTitle">Aufgabe hinzufügen</h2>
        <button id="closeDialog" aria-label="Schließen">x</button>
      </div>
      <div class="form">
        <label>Aufgabe <input id="title" value="Animation"></label>
        <label>Sendung
          <select id="broadcast">
            <option value="aktuell">Aktuell</option>
            <option value="mima">MiMa</option>
          </select>
        </label>
        <label>Typ
          <select id="projectType">
            <option>ANIM</option>
            <option>INFO</option>
            <option>KARTE</option>
          </select>
        </label>
        <input type="hidden" id="abbreviation" value="PMY">
        <div class="grid-2">
          <label>Auftrag von <input id="requester"></label>
          <label>Quelle
            <select id="source">
              <option>Formular</option>
              <option>Mail</option>
              <option>Mündlich</option>
              <option>Teams</option>
              <option>Sonstiges</option>
            </select>
          </label>
        </div>
        <div class="form-field"><span>Sendezeit</span>
          <div class="slots" id="slots"></div>
        </div>
        <div class="grid-2">
          <label>Deadline-Datum <input type="date" id="deadlineDate"></label>
          <label>Deadline-Zeit <input type="time" id="deadlineTime" value="17:15"></label>
        </div>
          <label>Notiz <textarea id="description" rows="4"></textarea></label>
          <div class="suggestion" id="timeSuggestion"></div>
      </div>
      <p class="hint">Die Daten werden lokal zwischengespeichert und mit dem Server synchronisiert.</p>
      <div class="modal-actions">
        <button id="cancel">Abbrechen</button>
        <button class="primary" id="create">Aufgabe anlegen</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "zeitmanagement-tool-v3";
    const BOARD_PREFERENCES_KEY = "zeitmanagement-board-preferences-v1";
    const API_URL = ["localhost", "127.0.0.1", "::1"].includes(location.hostname)
      ? ""
      : "https://mad-design.de/mdr/api.php";
    const BROADCASTS = {
      aktuell: {
        label: "Aktuell",
        slots: ["17:45", "19:30", "21:45"],
        defaultDeadline: "17:15",
        timelineStart: 12,
        timelineEnd: 22,
      },
      mima: {
        label: "MiMa",
        slots: ["12:00–13:00", "13:05–14:00"],
        defaultDeadline: "11:45",
        timelineStart: 10,
        timelineEnd: 15,
      },
    };
    const BOARD_COLORS = {
      slate: { label: "Schiefer", accent: "#6f8295", rgb: "111, 130, 149" },
      blue: { label: "Nachtblau", accent: "#536f91", rgb: "83, 111, 145" },
      teal: { label: "Petrol", accent: "#4f7b78", rgb: "79, 123, 120" },
      olive: { label: "Olive", accent: "#727a58", rgb: "114, 122, 88" },
      plum: { label: "Pflaume", accent: "#80677f", rgb: "128, 103, 127" },
      rust: { label: "Terrakotta", accent: "#8b6658", rgb: "139, 102, 88" },
    };
    const COLUMNS = [
      ["planning", "in Planung"],
      ["animation", "in Arbeit"],
      ["approval", "Abnahme"],
      ["delivered", "Fertig"],
    ];
    const TIMER_LABELS = { preparation: "Vorbereitung", animation: "in Arbeit" };
    let selectedSlot = "17:45";
    const initialBoardPreferences = loadBoardPreferences();
    let activeBroadcast = initialBoardPreferences.activeBroadcast;
    let boardColors = initialBoardPreferences.colors;
    let enabledBroadcasts = initialBoardPreferences.enabledBroadcasts;
    let boardPreferencesUpdatedAt = initialBoardPreferences.updatedAt;
    let view = "board";
    let editingId = null;
    let analysisQuery = "";
    let now = new Date();
    let warned = new Set();
    let openDetailIds = new Set();
    let draggingTaskId = null;
    let lastArchiveDate = toLocalDate(new Date());
    let tasks = archiveCompletedTasks(loadTasks(), now);
    let syncStatus = { tone: "ok", text: "Server-Sync aktiv." };
    let syncTimer = null;
    let isSyncing = false;
    let pendingServerSave = false;
    let lastServerPull = 0;

    function uid() {
      return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    }
    function loadBoardPreferences() {
      try {
        const stored = JSON.parse(localStorage.getItem(BOARD_PREFERENCES_KEY) || "{}");
        const enabledBroadcasts = Array.isArray(stored.enabledBroadcasts)
          ? stored.enabledBroadcasts.filter(key => BROADCASTS[key])
          : Object.keys(BROADCASTS);
        const safeEnabledBroadcasts = enabledBroadcasts.length ? enabledBroadcasts : ["aktuell"];
        return {
          activeBroadcast: safeEnabledBroadcasts.includes(stored.activeBroadcast) ? stored.activeBroadcast : safeEnabledBroadcasts[0],
          enabledBroadcasts: safeEnabledBroadcasts,
          colors: {
            aktuell: BOARD_COLORS[stored.colors && stored.colors.aktuell] ? stored.colors.aktuell : "blue",
            mima: BOARD_COLORS[stored.colors && stored.colors.mima] ? stored.colors.mima : "teal",
            board: BOARD_COLORS[stored.colors && stored.colors.board] ? stored.colors.board : "teal",
          },
          updatedAt: stored.updatedAt || new Date(0).toISOString(),
        };
      } catch {
        return { activeBroadcast: "aktuell", enabledBroadcasts: Object.keys(BROADCASTS), colors: { aktuell: "blue", mima: "teal", board: "teal" }, updatedAt: new Date(0).toISOString() };
      }
    }
    function boardState() {
      return { activeBroadcast, enabledBroadcasts, colors: boardColors, updatedAt: boardPreferencesUpdatedAt };
    }
    function normalizeBoardState(state) {
      if (!state || !Array.isArray(state.enabledBroadcasts)) return null;
      const safeEnabledBroadcasts = state.enabledBroadcasts.filter(key => BROADCASTS[key]);
      if (!safeEnabledBroadcasts.length) return null;
      const colors = state.colors || {};
      return {
        activeBroadcast: safeEnabledBroadcasts.includes(state.activeBroadcast) ? state.activeBroadcast : safeEnabledBroadcasts[0],
        enabledBroadcasts: safeEnabledBroadcasts,
        colors: {
          aktuell: BOARD_COLORS[colors.aktuell] ? colors.aktuell : "blue",
          mima: BOARD_COLORS[colors.mima] ? colors.mima : "teal",
          board: BOARD_COLORS[colors.board] ? colors.board : "teal",
        },
        updatedAt: state.updatedAt || new Date(0).toISOString(),
      };
    }
    function applyBoardState(state) {
      const normalized = normalizeBoardState(state);
      if (!normalized || new Date(normalized.updatedAt).getTime() < new Date(boardPreferencesUpdatedAt).getTime()) return false;
      activeBroadcast = normalized.activeBroadcast;
      enabledBroadcasts = normalized.enabledBroadcasts;
      boardColors = normalized.colors;
      boardPreferencesUpdatedAt = normalized.updatedAt;
      localStorage.setItem(BOARD_PREFERENCES_KEY, JSON.stringify(boardState()));
      return true;
    }
    function serverBoardStateIsOlder(state) {
      const normalized = normalizeBoardState(state);
      if (!normalized) return true;
      return new Date(normalized.updatedAt).getTime() < new Date(boardPreferencesUpdatedAt).getTime();
    }
    function saveBoardPreferences({ touch = true } = {}) {
      if (touch) boardPreferencesUpdatedAt = new Date().toISOString();
      localStorage.setItem(BOARD_PREFERENCES_KEY, JSON.stringify(boardState()));
    }
    function applyBoardColor() {
      const colorKey = boardColors.board || boardColors[activeBroadcast] || "slate";
      const color = BOARD_COLORS[colorKey];
      document.documentElement.style.setProperty("--board-accent", color.accent);
      document.documentElement.style.setProperty("--board-tint", color.rgb);
    }
    function renderBoardControls() {
      applyBoardColor();
    }
    function taskIsInActiveBroadcast(task) {
      return true;
    }
    function sendSlotMinutes(value) {
      const match = String(value || "").match(/(\d{1,2}):(\d{2})/);
      return match ? Number(match[1]) * 60 + Number(match[2]) : 0;
    }
    function toLocalDate(date) {
      const offset = date.getTimezoneOffset() * 60000;
      return new Date(date.getTime() - offset).toISOString().slice(0, 10);
    }
    function localDateFromIso(value) {
      return toLocalDate(new Date(value));
    }
    function combineDeadline(date, time) {
      return date + "T" + (time || "17:15");
    }
    function secondsBetween(start, end = new Date().toISOString()) {
      return Math.max(0, Math.floor((new Date(end).getTime() - new Date(start).getTime()) / 1000));
    }
    function formatDuration(seconds) {
      const minutes = Math.round(seconds / 60);
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return h === 0 ? m + "m" : h + "h " + String(m).padStart(2, "0") + "m";
    }
    function formatClock(value) {
      return new Intl.DateTimeFormat("de-DE", { hour: "2-digit", minute: "2-digit" }).format(new Date(value));
    }
    function formatDateTime(value) {
      return new Intl.DateTimeFormat("de-DE", {
        day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit"
      }).format(new Date(value));
    }
    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }
    function normalizeText(value) {
      return String(value || "").trim().toLowerCase();
    }
    function downloadJson(data, filename) {
      downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }), filename);
    }
    function sanitizeFolderName(name) {
      return (name || "Animationsprojekt").trim()
        .replace(/[<>:"/\\|?*\u0000-\u001F]/g, "-")
        .replace(/\s+/g, " ")
        .slice(0, 80) || "Animationsprojekt";
    }
    function getProjectFolderName(task) {
      return sanitizeFolderName(`AKT ${task.productionDeadline.slice(0, 10)} ${task.projectType} ${task.abbreviation || task.title}`);
    }
    function normalizeStatus(status) {
      if (status === "briefing" || status === "preparation") return "planning";
      if (status === "correction" || status === "render") return "approval";
      return ["planning", "animation", "approval", "delivered"].includes(status) ? status : "planning";
    }
    function normalizeTask(task) {
      return {
        id: task.id || uid(),
        title: task.title || "Animation",
        projectType: task.projectType || "ANIM",
        abbreviation: "PMY",
        source: task.source || "Formular",
        requester: task.requester || "",
        description: task.description || "",
        sendSlot: task.sendSlot || "17:45",
        broadcast: BROADCASTS[task.broadcast] ? task.broadcast : "aktuell",
        productionDeadline: task.productionDeadline || combineDeadline(toLocalDate(new Date()), "17:15"),
        workStatus: normalizeStatus(task.workStatus),
        activeTimer: task.activeTimer || null,
        sessions: task.sessions || [],
        createdAt: task.createdAt || new Date().toISOString(),
        updatedAt: task.updatedAt || task.completedAt || task.archivedAt || task.createdAt || new Date().toISOString(),
        completedAt: task.completedAt || null,
        archivedAt: task.archivedAt || null,
        deletedAt: task.deletedAt || null,
      };
    }
    function makeBackup() {
      return {
        app: "zeitmanagement",
        version: 4,
        exportedAt: new Date().toISOString(),
        tasks,
      };
    }
    function restoreBackup(data) {
      const importedTasks = Array.isArray(data) ? data : data && Array.isArray(data.tasks) ? data.tasks : null;
      if (!importedTasks) throw new Error("Keine Aufgaben gefunden.");
      tasks = archiveCompletedTasks(importedTasks.map(normalizeTask), new Date());
      save();
      render();
    }
    function updateSyncStatus(tone, text) {
      syncStatus = { tone, text };
      const box = document.getElementById("syncStatus");
      if (!box) return;
      box.className = "sync-status " + tone;
      box.textContent = text;
    }
    function icon(name) {
      const paths = {
        screen: '<rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8"></path><path d="M12 16v4"></path>',
        stopwatch: '<circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2"></path><path d="M9 2h6"></path>',
        alarm: '<circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2"></path><path d="M5 3 2 6"></path><path d="m19 3 3 3"></path>',
        clock: '<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>',
        play: '<path d="m8 5 11 7-11 7z"></path>',
        pause: '<path d="M8 5v14"></path><path d="M16 5v14"></path>',
        pencil: '<path d="M18 2 22 6 8 20 3 21l1-5Z"></path><path d="m15 5 4 4"></path>',
        folder: '<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path>',
        trash: '<path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 15H6L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path>',
      };
      return `<svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">${paths[name] || ""}</svg>`;
    }
    function taskVersionMs(task) {
      const dates = [task.deletedAt, task.updatedAt, task.archivedAt, task.completedAt, task.createdAt]
        .concat((task.sessions || []).flatMap(session => [session.startedAt, session.endedAt]))
        .filter(Boolean)
        .map(value => new Date(value).getTime())
        .filter(Number.isFinite);
      return dates.length ? Math.max(...dates) : 0;
    }
    function mergeTasks(localList, remoteList) {
      const map = new Map();
      localList.map(normalizeTask).forEach(task => map.set(task.id, task));
      remoteList.map(normalizeTask).forEach(task => {
        const current = map.get(task.id);
        if (!current || taskVersionMs(task) >= taskVersionMs(current)) map.set(task.id, task);
      });
      return Array.from(map.values()).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    }
    function tasksSignature(list) {
      return JSON.stringify(list.map(task => ({
        id: task.id,
        version: taskVersionMs(task),
        status: task.workStatus,
        active: task.activeTimer ? task.activeTimer.kind + task.activeTimer.startedAt : "",
      })).sort((a, b) => a.id.localeCompare(b.id)));
    }
    function touch(task) {
      return { ...task, updatedAt: new Date().toISOString() };
    }
    async function apiRequest(action, body = {}) {
      const response = await fetch(API_URL + "?action=" + encodeURIComponent(action) + "&_=" + Date.now(), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        cache: "no-store",
        body: JSON.stringify(body),
      });
      const data = await response.json().catch(() => null);
      if (!response.ok || !data || data.ok === false) {
        throw new Error(data && data.error ? data.error : "Server konnte nicht synchronisieren.");
      }
      return data;
    }
    async function loadFromServer({ silent = false } = {}) {
      if (isSyncing) return;
      isSyncing = true;
      try {
        const before = tasksSignature(tasks);
        const remote = await apiRequest("load");
        const remoteTasks = remote.tasks || [];
        const merged = archiveCompletedTasks(mergeTasks(tasks, remoteTasks), new Date());
        const remoteSignature = tasksSignature(remoteTasks.map(normalizeTask));
        const mergedSignature = tasksSignature(merged);
        tasks = merged;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        if (mergedSignature !== remoteSignature) pendingServerSave = true;
        const shouldSaveBoards = serverBoardStateIsOlder(remote.boards);
        const boardChanged = applyBoardState(remote.boards);
        if (shouldSaveBoards) pendingServerSave = true;
        syncStatus = { tone: "ok", text: "Server geladen: " + formatClock(new Date()) };
        if (tasksSignature(tasks) !== before || boardChanged || !silent) render();
      } catch (error) {
        syncStatus = { tone: "error", text: error.message };
        if (!silent) alert(error.message);
        render();
      } finally {
        isSyncing = false;
        if (pendingServerSave) {
          pendingServerSave = false;
          saveToServer({ silent: true });
        }
      }
    }
    async function saveToServer({ silent = false } = {}) {
      if (isSyncing) {
        pendingServerSave = true;
        return;
      }
      isSyncing = true;
      try {
        const remote = await apiRequest("save", { tasks, boards: boardState() });
        tasks = archiveCompletedTasks(mergeTasks(tasks, remote.tasks || []), new Date());
        applyBoardState(remote.boards);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        syncStatus = { tone: "ok", text: "Server gespeichert: " + formatClock(new Date()) };
        if (!silent) alert("Server wurde gespeichert.");
        render();
      } catch (error) {
        syncStatus = { tone: "error", text: error.message };
        if (!silent) alert(error.message);
        render();
      } finally {
        isSyncing = false;
        if (pendingServerSave) {
          pendingServerSave = false;
          saveToServer({ silent: true });
        }
      }
    }
    function queueServerSync() {
      clearTimeout(syncTimer);
      syncStatus = { tone: "warn", text: "Server-Sync wartet..." };
      syncTimer = setTimeout(() => saveToServer({ silent: true }), 900);
    }
    function loadTasks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("zeitmanagement-tool-v2") || localStorage.getItem("zeitmanagement-tool-v1");
        return raw ? JSON.parse(raw).map(normalizeTask) : [];
      } catch {
        return [];
      }
    }
    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      queueServerSync();
    }
    function saveBackup() {
      downloadJson(makeBackup(), `zeitmanagement-backup-${toLocalDate(new Date())}.json`);
    }
    function loadBackupFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          restoreBackup(JSON.parse(String(reader.result || "")));
          alert("Backup wurde geladen.");
        } catch (error) {
          alert("Backup konnte nicht gelesen werden: " + error.message);
        }
      };
      reader.readAsText(file, "utf-8");
    }
    function archiveCompletedTasks(list, date = new Date()) {
      const today = toLocalDate(date);
      return list.map(task => {
        if (task.deletedAt || task.archivedAt || !task.completedAt || localDateFromIso(task.completedAt) >= today) return task;
        return touch({ ...task, archivedAt: date.toISOString() });
      });
    }
    function sumSessions(task, kind) {
      let seconds = (task.sessions || [])
        .filter(session => !kind || session.kind === kind)
        .reduce((sum, session) => sum + session.seconds, 0);
      if (task.activeTimer && (!kind || task.activeTimer.kind === kind)) {
        seconds += secondsBetween(task.activeTimer.startedAt);
      }
      return seconds;
    }
    function average(list, kind) {
      const values = list.map(task => sumSessions(task, kind)).filter(Boolean);
      if (!values.length) return "-";
      return formatDuration(values.reduce((sum, value) => sum + value, 0) / values.length);
    }
    function averageForSimilar(title, kind) {
      const words = normalizeText(title).split(/\s+/).filter(word => word.length > 3);
      const finished = completedTasks().concat(archivedTasks());
      const similar = finished.filter(task => words.some(word => normalizeText(task.title).includes(word)));
      const source = similar.length >= 2 ? similar : finished;
      return average(source, kind);
    }
    function risk(task) {
      if (task.completedAt || task.workStatus === "delivered") return "done";
      const remaining = Math.floor((new Date(task.productionDeadline).getTime() - now.getTime()) / 1000);
      if (remaining <= 0) return "late";
      if (remaining <= 15 * 60) return "critical";
      if (remaining <= 30 * 60) return "tight";
      return "ok";
    }
    function riskLabel(value) {
      return { done: "Fertig", late: "Überfällig", critical: "Kritisch", tight: "Knapp", ok: "Im Plan" }[value] || "Im Plan";
    }
    function closeTimer(task) {
      if (!task.activeTimer) return task;
      const endedAt = new Date().toISOString();
      return {
        ...task,
        activeTimer: null,
        updatedAt: endedAt,
        sessions: [...task.sessions, {
          id: uid(),
          kind: task.activeTimer.kind,
          startedAt: task.activeTimer.startedAt,
          endedAt,
          seconds: secondsBetween(task.activeTimer.startedAt, endedAt),
        }],
      };
    }
    function activeTasks() {
      return tasks
        .filter(task => taskIsInActiveBroadcast(task) && !task.deletedAt && !task.archivedAt && !task.completedAt && task.workStatus !== "delivered")

      return tasks.filter(task => taskIsInActiveBroadcast(task) && !task.deletedAt && !task.archivedAt && (task.completedAt || task.workStatus === "delivered"));

        changed = true;
        return touch({ ...task, archivedAt: stamp });

    function renderTimeline() {
      const timelineStart = Math.min(...Object.values(BROADCASTS).map(broadcast => broadcast.timelineStart));
      const timelineEnd = Math.max(...Object.values(BROADCASTS).map(broadcast => broadcast.timelineEnd));
      const hours = Array.from({ length: timelineEnd - timelineStart + 1 }, (_, index) => timelineStart + index);
      const totalMinutes = (timelineEnd - timelineStart) * 60;
      const nowPosition = ((now.getHours() * 60 + now.getMinutes() - timelineStart * 60) / totalMinutes) * 100;
      const rows = activeTasks().map(task => {
        const deadline = new Date(task.productionDeadline);
        const deadlineMinutes = deadline.getHours() * 60 + deadline.getMinutes();
        const created = new Date(task.createdAt);
        const createdMinutes = created.getHours() * 60 + created.getMinutes();
        const startMinutes = Math.max(timelineStart * 60, Math.min(createdMinutes, deadlineMinutes));
        const left = ((startMinutes - timelineStart * 60) / totalMinutes) * 100;
        const width = ((deadlineMinutes - startMinutes) / totalMinutes) * 100;
        const sendLeft = ((sendSlotMinutes(task.sendSlot) - timelineStart * 60) / totalMinutes) * 100;
        const deadlineLeft = ((deadlineMinutes - timelineStart * 60) / totalMinutes) * 100;
        const state = risk(task);

          <div class="time-label"><strong>${escapeHtml(task.title)}</strong><span>${formatDuration(sumSessions(task))} erfasst</span></div>

            <span class="pin" style="left:${deadlineLeft}%">Deadline ${formatClock(task.productionDeadline)}</span>
            <span class="pin send" style="left:${sendLeft}%">Sendung ${task.sendSlot}</span>

        if (task.activeTimer && task.activeTimer.kind === kind) {
          return closeTimer(task);

        const closed = closeTimer(task);

      });

    async function downloadFolder(id) {
      const task = tasks.find(item => item.id === id);
      if (!task) return;
      const folderName = getProjectFolderName(task);
      if (window.JSZip) {
        const zip = new JSZip();

        const blob = await zip.generateAsync({ type: "blob" });

      const bat = `@echo off\r\nmkdir "${folderName}"\r\nmkdir "${folderName}\\Ergebnis"\r\nmkdir "${folderName}\\Material"\r\nmkdir "${folderName}\\Preview"\r\n`;
      downloadBlob(new Blob([bat], { type: "text/plain" }), folderName + "_Ordner_anlegen.bat");

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;
      for (let index = 0; index < text.length; index += 1) {
        const char = text[index];
        const next = text[index + 1];
        if (char === '"' && quoted && next === '"') {
          value += '"';
          index += 1;
        } else if (char === '"') {
          quoted = !quoted;
        } else if ((char === "," || char === ";") && !quoted) {
          row.push(value.trim());
          value = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") index += 1;
          row.push(value.trim());
          if (row.some(Boolean)) rows.push(row);
          row = [];
          value = "";
        } else {
          value += char;
        }
      }
      row.push(value.trim());
      if (row.some(Boolean)) rows.push(row);
      return rows;
    }
    function pickField(row, headers, names) {
      for (const name of names) {
        const index = headers.findIndex(header => normalizeText(header) === normalizeText(name));
        if (index >= 0 && row[index]) return row[index];
      }
      return "";
    }
    function parseDateInput(value) {
      const raw = String(value || "").trim();
      if (!raw) return toLocalDate(new Date());
      const german = raw.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
      if (german) {
        const year = german[3].length === 2 ? "20" + german[3] : german[3];
        return `${year}-${String(german[2]).padStart(2, "0")}-${String(german[1]).padStart(2, "0")}`;
      }
      const parsed = new Date(raw);
      if (!Number.isNaN(parsed.getTime())) return toLocalDate(parsed);
      return toLocalDate(new Date());
    }
    function parseTimeInput(value, fallback = "17:15") {
      const raw = String(value || "").trim();
      const match = raw.match(/(\d{1,2})[:.](\d{2})/);
      if (!match) return fallback;
      return `${String(match[1]).padStart(2, "0")}:${match[2]}`;
    }
    function mapStatus(value) {
      const text = normalizeText(value);
      if (text.includes("arbeit") || text.includes("progress")) return "animation";
      if (text.includes("abnahme") || text.includes("review")) return "approval";
      if (text.includes("fertig") || text.includes("bereit") || text.includes("done") || text.includes("complete")) return "delivered";
      return "planning";
    }
    function importCsvFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const rows = parseCsv(String(reader.result || ""));
          if (rows.length < 2) throw new Error("Die Datei enthält keine Aufgaben.");
          const headers = rows[0];
          const imported = rows.slice(1).map(row => {
            const broadcastKey = normalizeText(pickField(row, headers, ["Board", "Sendungstyp", "Format"])).includes("mima") ? "mima" : "aktuell";
            const broadcast = BROADCASTS[broadcastKey];
            const title = pickField(row, headers, ["Aufgabe", "Titel", "Title", "Task", "Name"]) || "Importierte Aufgabe";
            const date = parseDateInput(pickField(row, headers, ["Deadline-Datum", "Fälligkeitsdatum", "Due date", "Due", "Datum"]));
            const time = parseTimeInput(pickField(row, headers, ["Deadline-Zeit", "Uhrzeit", "Time", "Deadline"]), broadcast.defaultDeadline);
            const importedSlot = pickField(row, headers, ["Sendezeit", "Sendung", "Sendetermin"]);
            const sendSlot = broadcast.slots.includes(importedSlot) ? importedSlot : broadcast.slots[0];
            const status = mapStatus(pickField(row, headers, ["Bucket", "Status", "Spalte", "Progress"]));
            return normalizeTask({
              id: uid(),
              title,
              broadcast: broadcastKey,
              projectType: pickField(row, headers, ["Typ", "Type"]) || "ANIM",
              abbreviation: "PMY",
              source: "Teams",
              requester: pickField(row, headers, ["Auftrag von", "Auftraggeber", "Assigned to", "Zugewiesen an"]),
              description: pickField(row, headers, ["Notiz", "Beschreibung", "Description", "Notes"]),
              sendSlot,
              productionDeadline: combineDeadline(date, time),
              workStatus: status,
              activeTimer: null,
              sessions: [],
              createdAt: new Date().toISOString(),
              updatedAt: new Date().toISOString(),
              completedAt: status === "delivered" ? new Date().toISOString() : null,
              archivedAt: null,
            });
          });
          let added = 0;
          imported.forEach(task => {
            const duplicate = tasks.some(existing => !existing.deletedAt &&
              existing.broadcast === task.broadcast &&
              normalizeText(existing.title) === normalizeText(task.title) &&
              existing.productionDeadline === task.productionDeadline
            );
            if (!duplicate) {
              tasks.unshift(task);
              added += 1;
            }
          });
          save();
          render();
          alert(`${added} Aufgaben importiert. ${imported.length - added} Duplikate übersprungen.`);
        } catch (error) {
          alert("CSV konnte nicht importiert werden: " + error.message);
        }
      };
      reader.readAsText(file, "utf-8");
    }
    async function enableNotifications() {
      if (!("Notification" in window)) return alert("Dieser Browser unterstützt keine Benachrichtigungen.");
      const permission = await Notification.requestPermission();
      updateNotificationButton(permission);
    }
    function updateNotificationButton(permission) {
      const button = document.getElementById("notify");
      const active = permission === "granted";
      const label = active ? "Benachrichtigungen aktiv" : "Benachrichtigungen aktivieren";
      button.classList.toggle("active", active);
      button.title = label;
      button.setAttribute("aria-label", label);
    }
    function warnCritical() {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      activeTasks().forEach(task => {
        const minutesLeft = Math.floor((new Date(task.productionDeadline).getTime() - now.getTime()) / 60000);
        const state = risk(task);
        const key = `${task.id}-${state}-${minutesLeft}`;
        const shouldWarn = state === "critical" || minutesLeft === 30 || minutesLeft === 15 || minutesLeft === 5;
        if (!shouldWarn || warned.has(key)) return;
        warned.add(key);
        new Notification(`Zeitkritisch: ${task.title}`, {
          body: `${riskLabel(state)}. Deadline ${formatClock(task.productionDeadline)}, Sendung ${task.sendSlot}.`,
        });
      });
    }

    document.getElementById("openDialog").addEventListener("click", () => openDialog());
    document.getElementById("closeDialog").addEventListener("click", closeDialog);
    document.getElementById("cancel").addEventListener("click", closeDialog);
    document.getElementById("create").addEventListener("click", createTask);
    document.getElementById("notify").addEventListener("click", enableNotifications);
    document.getElementById("backupFile").addEventListener("change", event => {
      const file = event.target.files && event.target.files[0];
      if (file) loadBackupFile(file);
      event.target.value = "";
    });
    document.getElementById("csvFile").addEventListener("change", event => {
      const file = event.target.files && event.target.files[0];
      if (file) importCsvFile(file);
      event.target.value = "";
    });
    document.getElementById("title").addEventListener("input", updateSuggestion);
    document.getElementById("broadcast").addEventListener("change", event => {
      const broadcast = BROADCASTS[event.target.value];
      selectedSlot = broadcast.slots[0];
      document.getElementById("deadlineTime").value = broadcast.defaultDeadline;
      renderSlots();
    });
    document.querySelector(".switch").addEventListener("click", event => {
      const button = event.target.closest("button[data-view]");
      if (!button) return;
      view = button.dataset.view;
      render();
    });
    document.getElementById("modal").addEventListener("click", event => {
      const button = event.target.closest("button[data-slot]");
      if (!button) return;
      event.preventDefault();
      selectedSlot = button.dataset.slot;
      renderSlots();
    });
	    document.getElementById("view").addEventListener("click", event => {
	      const colorButton = event.target.closest("button[data-board-color]");
	      if (colorButton) {
	        boardColors.board = colorButton.dataset.boardColor;
	        saveBoardPreferences();
	        save();
	        render();
	        return;
	      }
	      const button = event.target.closest("button[data-action]");
	      if (button) {
        if (button.dataset.action === "timer") startTimer(button.dataset.id, button.dataset.kind);
        if (button.dataset.action === "stop") stopTimer(button.dataset.id);
        if (button.dataset.action === "folder") downloadFolder(button.dataset.id);
        if (button.dataset.action === "edit") openDialog(button.dataset.id);
        if (button.dataset.action === "move") moveTask(button.dataset.id, button.dataset.status);
        if (button.dataset.action === "delete") deleteTask(button.dataset.id);
        return;
      }
      if (event.target.id === "saveBackup") saveBackup();
      if (event.target.id === "loadBackup") document.getElementById("backupFile").click();
      if (event.target.id === "importCsv") document.getElementById("csvFile").click();
      if (event.target.id === "closeDay") archiveWorkday();
      if (event.target.id === "loadServer") loadFromServer();
      if (event.target.id === "saveServer") saveToServer();
    });
    document.getElementById("view").addEventListener("input", event => {
      if (event.target.id !== "analysisSearch") return;
      analysisQuery = event.target.value;
      renderAnalysis();
    });
    document.getElementById("view").addEventListener("toggle", event => {
      const details = event.target.closest("details[data-details-id]");
      if (!details) return;
      if (details.open) openDetailIds.add(details.dataset.detailsId);
      else openDetailIds.delete(details.dataset.detailsId);
    }, true);
    document.getElementById("view").addEventListener("dragstart", event => {
      const card = event.target.closest(".card");
      if (card) {
        draggingTaskId = card.dataset.id;
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/task-id", card.dataset.id);
      }
    });
    document.getElementById("view").addEventListener("dragend", () => {
      draggingTaskId = null;
    });
    document.getElementById("view").addEventListener("dragover", event => {
      if (event.target.closest(".column")) event.preventDefault();
    });
    document.getElementById("view").addEventListener("drop", event => {
      const column = event.target.closest(".column");
      if (!column) return;
      event.preventDefault();
      const id = event.dataTransfer.getData("text/task-id") || draggingTaskId;
      draggingTaskId = null;
      if (id) moveTask(id, column.dataset.column);
    });
    setInterval(() => {
      now = new Date();
      const today = toLocalDate(now);
      if (today !== lastArchiveDate) {
        lastArchiveDate = today;
        tasks = archiveCompletedTasks(tasks, now);
        save();
      }
      warnCritical();
      if (draggingTaskId) return;
      if (!shouldPauseLiveRender() && Date.now() - lastServerPull > 1000) {
        lastServerPull = Date.now();
        loadFromServer({ silent: true });
      }
      if (shouldPauseLiveRender()) return;
      render();
    }, 1000);

    renderSlots();
    updateNotificationButton("Notification" in window ? Notification.permission : "default");
    render();
    loadFromServer({ silent: true });
  </script>
</body>
</html>
