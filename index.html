<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zeitmanagement">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Zeitmanagement</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root {
      --bg: #101214;
      --surface: #16191d;
      --panel: #1d2127;
      --panel-2: #242932;
      --panel-3: #2a303a;
      --line: #373f4b;
      --line-soft: rgba(255, 255, 255, .07);
      --text: #f4f6f8;
      --muted: #aeb6c2;
      --muted-2: #7f8895;
      --pink: #f05379;
      --blue: #2388ff;
      --yellow: #ffd84d;
      --green: #45d483;
      --orange: #e9b949;
      --board-accent: #6f8295;
      --board-tint: 111, 130, 149;
      --shadow: 0 20px 60px rgba(0, 0, 0, .34);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(var(--board-tint), .13) 0, transparent 300px),
        var(--bg);
      background-size: auto, auto;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    button {
      min-height: 40px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      font-weight: 750;
      padding: 9px 13px;
      transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
    }
    @media (hover: hover) and (pointer: fine) {
      button:hover {
        transform: translateY(-1px);
        border-color: rgba(255,255,255,.18);
        background: #2b323d;
      }
    }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid rgba(35, 136, 255, .85);
      outline-offset: 2px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(16, 18, 20, .92);
      padding: 22px 28px 18px;
      backdrop-filter: blur(18px);
    }
    .header-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      max-width: 1600px;
      margin: 0 auto;
    }
    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(30px, 4vw, 50px);
      font-weight: 850;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
	    .color-palette {
	      display: flex;
	      flex-wrap: wrap;
	      gap: 10px;
	      align-items: center;
	    }
	    .color-palette button {
	      width: 38px;
	      min-width: 38px;
	      min-height: 38px;
	      border: 2px solid transparent;
	      border-radius: 999px;
	      background: var(--swatch);
	      padding: 0;
	    }
	    .color-palette button.active {
	      border-color: #f4f6f8;
	      box-shadow: 0 0 0 3px rgba(255,255,255,.13), 0 12px 24px rgba(0,0,0,.22);
	    }
    .board-color-preview {
      border: 1px solid rgba(var(--board-tint), .34);
      border-left: 5px solid var(--board-accent);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(var(--board-tint), .14), rgba(255,255,255,.035));
      color: var(--text);
      font-size: 13px;
      font-weight: 850;
      margin-top: 12px;
      padding: 12px;
    }
    .task-color-palette {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .task-color-palette button {
      position: relative;
      width: 34px;
      min-width: 34px;
      min-height: 34px;
      border: 2px solid transparent;
      border-radius: 999px;
      background: var(--swatch);
      padding: 0;
    }
    .task-color-palette button.active {
      border-color: #f4f6f8;
      box-shadow: 0 0 0 2px rgba(255,255,255,.14);
    }
    .task-color-palette button.active::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 11px;
      height: 6px;
      border-left: 3px solid white;
      border-bottom: 3px solid white;
      transform: translate(-50%, -60%) rotate(-45deg);
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.55));
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 10px;
    }
    .metric {
      min-width: 120px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
      padding: 11px 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 20px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      max-width: 1600px;
      margin: 20px auto 0;
    }
    .add {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border-color: rgba(35, 136, 255, .85);
      background: linear-gradient(180deg, #2d94ff, #176fd8);
      color: white;
      box-shadow: 0 12px 30px rgba(35, 136, 255, .25);
    }
    .add span {
      font-size: 25px;
      line-height: 0;
      font-weight: 400;
    }
    .secondary {
      background: rgba(255,255,255,.045);
      color: var(--text);
    }
    .icon-button {
      width: 42px;
      min-width: 42px;
      display: inline-grid;
      place-items: center;
      padding: 8px;
    }
    .icon-button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-button.active {
      border-color: var(--yellow);
      background: var(--yellow);
      color: #151515;
    }
    .svg-icon {
      width: 20px;
      height: 20px;
      display: inline-block;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.25;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: middle;
    }
    .switch {
      display: inline-grid;
      grid-template-columns: repeat(5, minmax(105px, 1fr));
      overflow: hidden;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .switch button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: #c9c9c4;
    }
    .switch button:last-child { border-right: 0; }
    .switch button.active {
      background: var(--yellow);
      color: #111;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.18);
    }
    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px 28px 38px;
    }
    .learning {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .learning > div, .panel {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(29, 33, 39, .82);
      padding: 14px 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
    }
    .learning span {
      color: var(--muted);
      font-weight: 800;
    }
    .learning strong { float: right; }
    .board {
      display: grid;
      grid-auto-columns: minmax(390px, 1fr);
      grid-auto-flow: column;
      gap: 14px;
      min-height: calc(100vh - 220px);
      overflow-x: auto;
      overflow-y: visible;
      padding-bottom: 8px;
      scroll-snap-type: x proximity;
    }
    .mobile-board-tabs {
      display: none;
    }
    .mobile-task-list {
      display: none;
    }
    .mobile-timeline-list {
      display: none;
    }
    .column {
      overflow: hidden;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(var(--board-tint), .075), rgba(22, 25, 29, .88) 150px);
      min-width: 390px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
      scroll-snap-align: start;
    }
    .column-head {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line-soft);
      border-radius: var(--radius) var(--radius) 0 0;
      background: linear-gradient(180deg, rgba(var(--board-tint), .18), rgba(36, 41, 50, .96));
      padding: 13px 14px;
    }
    .column-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .01em;
    }
    .column-head span {
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: #d9d9d3;
      font-size: 12px;
      font-weight: 900;
      padding: 4px 8px;
    }
    .stack {
      display: grid;
      align-content: start;
      gap: 11px;
      min-height: 520px;
      padding: 12px;
    }
    .empty {
      border: 1px dashed rgba(255,255,255,.17);
      border-radius: var(--radius);
      color: #8f918e;
      font-size: 13px;
      font-weight: 800;
      padding: 18px;
      text-align: center;
      background: rgba(255,255,255,.025);
    }
	    .card {
	      position: relative;
	      min-width: 0;
	      border: 1px solid rgba(255,255,255,.09);
	      border-left: 5px solid var(--green);
	      border-radius: var(--radius);
	      background:
	        linear-gradient(180deg, rgba(var(--board-tint), .1), transparent 92px),
	        linear-gradient(180deg, #252a32, #1c2026);
	      color: var(--text);
	      cursor: grab;
	      padding: 14px;
	      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.34);
	      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease, background .16s ease;
	    }
	    .card.color-highlight {
	      border-color: rgba(var(--task-tint), .72);
	      border-left-color: var(--task-accent, var(--green));
	      background:
	        linear-gradient(145deg, rgba(var(--task-tint), .84), rgba(var(--task-tint), .48)),
	        linear-gradient(180deg, #20252d, #171b20);
	      color: #f8fafc;
	    }
    .card.ok {
      border-left-color: var(--task-accent, var(--green));
    }
    @media (hover: hover) and (pointer: fine) {
      .card:hover {
        transform: translateY(-2px);
        border-color: rgba(255,255,255,.16);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.32);
      }
    }
	    .card.tight {
	      border-left-color: var(--orange);
	      box-shadow: 0 0 0 2px rgba(233, 185, 73, .24), 0 18px 42px rgba(0, 0, 0, 0.34);
	    }
	    .card.critical, .card.late {
	      border-left-color: var(--pink);
	      box-shadow: 0 0 0 2px rgba(240, 79, 120, .3), 0 18px 42px rgba(0, 0, 0, 0.34);
	    }
	    .card.done {
	      filter: saturate(.7);
	    }
	    .card.critical {
	      box-shadow: 0 0 0 2px rgba(240, 79, 120, .3), 0 18px 42px rgba(0, 0, 0, 0.34);
	    }
    .card.late {
      animation: urgentPulse 1.4s ease-in-out infinite;
    }
    @keyframes urgentPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(240, 79, 120, .5), 0 10px 24px rgba(0, 0, 0, .22); }
      50% { box-shadow: 0 0 0 4px rgba(240, 79, 120, .18), 0 10px 24px rgba(0, 0, 0, .22); }
    }
    .card-main {
      display: grid;
      min-width: 0;
      gap: 12px;
    }
    .card-title-row {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }
	    .card-title-row h3 {
	      margin: 0;
	      color: #fff;
	      font-size: 24px;
	      font-weight: 900;
	      line-height: 1.06;
	      letter-spacing: 0;
	    }
    .cover-image {
      width: 100%;
      max-width: 100%;
      aspect-ratio: 21 / 9;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      padding: 0;
      cursor: zoom-in;
    }
    .cover-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
	    .deadline-pill {
	      flex: 0 0 auto;
	      display: inline-flex;
	      align-items: center;
	      gap: 6px;
	      border-radius: 999px;
	      background: rgba(0,0,0,.24);
	      color: #fff;
	      font-size: 12px;
	      font-weight: 900;
	      padding: 6px 9px;
	      white-space: nowrap;
	    }
    .card-focus {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(74px, auto);
      gap: 12px;
      align-items: stretch;
    }
    .play-cluster {
      display: grid;
      gap: 5px;
      justify-items: center;
      align-content: center;
    }
	    .time-left {
	      min-width: 0;
	      border: 1px solid rgba(255,255,255,.18);
	      border-radius: var(--radius);
	      background: rgba(0,0,0,.22);
	      padding: 10px 12px;
	    }
    .time-left span {
      display: block;
	      color: rgba(255,255,255,.76);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .time-left strong {
      display: block;
      margin-top: 4px;
      font-size: 28px;
      line-height: 1;
    }
    .play-button {
      min-width: 78px;
      min-height: 66px;
      border-color: rgba(56, 193, 114, .7);
      background: linear-gradient(180deg, #40d17c, #219653);
      color: white;
      font-size: 0;
      box-shadow: 0 14px 28px rgba(56, 193, 114, .18);
    }
    .play-button::before {
      content: "";
      display: inline-block;
      width: 0;
      height: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 18px solid currentColor;
      margin-left: 4px;
      vertical-align: middle;
    }
    .nav-icon {
      display: none;
    }
    .mobile-tab-icon {
      display: none;
    }
    .play-button.active {
      border-color: rgba(240, 79, 120, .8);
      background: linear-gradient(180deg, #ff6a8f, #d73562);
      color: white;
    }
    .play-button.active::before {
      width: 18px;
      height: 22px;
      border: 0;
      border-left: 6px solid currentColor;
      border-right: 6px solid currentColor;
      margin-left: 0;
    }
	    .card-subline {
	      display: flex;
	      flex-wrap: wrap;
	      align-items: center;
	      gap: 7px;
	      color: rgba(255,255,255,.82);
	      font-size: 12px;
	      font-weight: 800;
	    }
    .card-subline span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .card-subline .deadline-pill {
      color: #eef2f6;
    }
	    .details-toggle {
	      display: grid;
	      place-items: center;
	      min-height: 34px;
	      border-color: rgba(255,255,255,.18);
	      background: rgba(0,0,0,.2);
	      color: rgba(255,255,255,.86);
      font-size: 12px;
      padding: 6px 9px;
      text-align: center;
    }
    .details-toggle::before {
      content: "⌄";
      color: currentColor;
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
    }
    .card details {
      margin-top: 10px;
    }
    .card summary {
      list-style: none;
    }
    .card summary::-webkit-details-marker {
      display: none;
    }
	    .card details[open] .details-toggle {
	      color: #fff;
	      background: rgba(0,0,0,.28);
	    }
    .card details[open] .details-toggle::before {
      content: "⌃";
    }
    .card-details {
      display: grid;
      gap: 10px;
      border-top: 1px solid rgba(255,255,255,.08);
      margin-top: 10px;
      padding-top: 10px;
    }
    .kicker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
	    .kicker span {
	      border-radius: 999px;
	      background: rgba(0,0,0,.22);
	      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
    }
	    .card p {
	      margin: 6px 0 0;
	      color: rgba(255,255,255,.82);
	    }
    .risk, .timer-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 12px;
    }
	    .risk div, .timer {
	      border: 1px solid rgba(255,255,255,.18);
	      border-radius: var(--radius);
	      background: rgba(0,0,0,.2);
	      padding: 9px;
	    }
    .risk span {
      display: block;
	      color: rgba(255,255,255,.74);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .risk strong, .timer strong {
      display: block;
      margin-top: 3px;
      font-size: 17px;
    }
    .timer {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
    }
    .timer.active {
      border-color: var(--yellow);
      background: rgba(255, 216, 77, .16);
      box-shadow: inset 0 0 0 1px rgba(255, 216, 77, .25);
    }
    .split-actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .split-actions button {
      width: 100%;
      margin-top: 0;
    }
    .card-icon-button {
      display: grid;
      place-items: center;
      min-height: 42px;
      font-size: 20px;
      line-height: 1;
    }
	    .folder { background: rgba(255,255,255,.06); }
    .card .secondary, .card .folder, .card .file-actions button, .card .file-actions a {
      border-color: rgba(255,255,255,.2);
      background: rgba(0,0,0,.2);
      color: #fff;
    }
    .card .secondary:focus-visible, .card .folder:focus-visible,
    .card .file-actions button:focus-visible, .card .file-actions a:focus-visible {
      outline-color: rgba(255,255,255,.9);
    }
	    .delete-action {
	      border-color: rgba(255,255,255,.2);
	      background: rgba(0,0,0,.22);
	      color: #fff;
	    }
    @media (hover: hover) and (pointer: fine) {
      .delete-action:hover, .delete-action:focus-visible {
        border-color: rgba(240, 83, 121, .6);
        background: rgba(240, 83, 121, .14);
        color: white;
      }
    }
    .note {
      border-left: 3px solid var(--orange);
      margin-top: 12px;
      padding-left: 10px;
    }
    .attachment-list {
      display: grid;
      gap: 7px;
    }
    .attachment-list {
      margin-top: 2px;
    }
	    .file-card, .upload-item {
	      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
	      border: 1px solid var(--line-soft);
	      border-radius: var(--radius);
	      background: rgba(255,255,255,.045);
      color: var(--text);
      padding: 8px 10px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      min-width: 0;
	    }
    .card .file-card {
      border-color: rgba(255,255,255,.18);
      background: rgba(0,0,0,.2);
      color: #fff;
    }
	    .file-card small, .upload-item small {
	      color: var(--muted);
	      font-weight: 800;
	    }
    .card .file-card small {
      color: rgba(255,255,255,.72);
    }
    .file-info {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .file-info span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-actions {
      display: inline-flex;
      flex: 0 0 auto;
      gap: 6px;
    }
    .file-actions button, .file-actions a {
      min-width: 34px;
      min-height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      color: var(--text);
      padding: 5px;
      text-decoration: none;
    }
    .file-actions .danger {
      color: #f2a4b8;
    }
    .timeline-panel, .analysis-panel {
      overflow-x: auto;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: #16191d;
      box-shadow: var(--shadow);
    }
    .panel-head {
      display: flex;
      min-width: 920px;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--line-soft);

        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: .06em;
        text-transform: uppercase;
      }
      .mobile-timeline-summary strong {
        display: block;
        margin-top: 3px;
        overflow: hidden;
        font-size: 20px;
        line-height: 1.1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mobile-slot {
        overflow: hidden;
        border: 1px solid var(--line-soft);
        border-radius: var(--radius);
        background: rgba(22, 25, 29, .88);
      }
      .mobile-slot-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-bottom: 1px solid var(--line-soft);
        background: linear-gradient(180deg, rgba(var(--board-tint), .18), rgba(36, 41, 50, .96));

        display: inline-flex;
        min-width: 0;
        align-items: center;
        gap: 7px;
        font-size: 18px;
        font-weight: 900;
      }
      .mobile-slot-head strong {
        display: inline-grid;
        place-items: center;
        min-width: 28px;
        height: 28px;
        border-radius: 999px;
        background: rgba(255,255,255,.09);

      .mobile-slot-stack {
        display: grid;
        gap: 10px;
        padding: 10px;
      }
      .mobile-timeline-item {
        border: 1px solid rgba(255,255,255,.09);
        border-left: 4px solid var(--green);
        border-radius: var(--radius);
        background: linear-gradient(180deg, rgba(var(--board-tint), .11), transparent 90px), linear-gradient(180deg, #252a32, #1c2026);
        padding: 13px;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.24);

      .mobile-timeline-item.tight { border-left-color: var(--orange); }
      .mobile-timeline-item.critical, .mobile-timeline-item.late { border-left-color: var(--pink); }

        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;

      .mobile-timeline-item h3 {
        margin: 0;
        font-size: 24px;
        line-height: 1.04;
      }
      .mobile-status-pill {
        border-radius: 999px;
        background: rgba(255,255,255,.08);
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        padding: 5px 8px;
        white-space: nowrap;
      }
      .mobile-timeline-item.critical .mobile-status-pill,
      .mobile-timeline-item.late .mobile-status-pill {
        background: rgba(240, 83, 121, .16);
        color: #ffd5df;
      }
      .mobile-timeline-item.tight .mobile-status-pill {
        background: rgba(233, 185, 73, .16);

      }
      .mobile-timeline-item .cover-image {
        margin-top: 10px;

        display: flex;

        gap: 8px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 850;
      }
      .mobile-timeline-meta span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .mobile-progress {
        height: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255,255,255,.075);
        margin-top: 12px;
      }
      .mobile-progress-labels {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 850;
      }
      .mobile-progress span {
        display: block;
        width: var(--progress);
        height: 100%;
        border-radius: inherit;
        background: var(--green);
      }
      .mobile-timeline-item.tight .mobile-progress span { background: var(--orange); }
      .mobile-timeline-item.critical .mobile-progress span,
      .mobile-timeline-item.late .mobile-progress span { background: var(--pink); }
      .mobile-task-list .empty {
        min-height: 130px;
        display: grid;
        place-items: center;
      }
      .mobile-task-list .card {
        width: 100%;
        max-width: none;
        border-left-width: 4px;
        padding: 12px;
        cursor: default;
      }
      .mobile-task-list .card[draggable="true"] {
        -webkit-user-drag: none;
      }
      .mobile-task-list .card-title-row h3 {
        font-size: 28px;
        line-height: 1.03;
      }
      .mobile-task-list .cover-image {
        max-height: 168px;
      }
      .mobile-task-list .card-focus {
        grid-template-columns: minmax(0, 1fr) 92px;
        gap: 10px;
      }
      .mobile-task-list .time-left {
        min-height: 76px;
        padding: 12px;
      }
      .mobile-task-list .time-left strong {
        font-size: 34px;
      }
      .mobile-task-list .play-button {
        width: 92px;
        min-width: 92px;
        min-height: 76px;
      }
      .mobile-task-list .card-subline {
        justify-content: space-between;
        gap: 8px;
      }
      .mobile-task-list .deadline-pill {
        margin-left: auto;
      }
      .mobile-task-list .details-toggle {
        min-height: 42px;
      }
      .mobile-task-list .risk, .mobile-task-list .timer-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .mobile-task-list .timer {
        min-height: 64px;
      }
      .mobile-task-list .split-actions {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .mobile-task-list .card-icon-button {

      .mobile-task-list .file-card {

      }
      .mobile-task-list .file-info {

      }

        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .timeline-panel, .analysis-panel {
        border-radius: var(--radius);
      }
      .timeline-panel {
        display: none;
      }
      .panel-head {
        min-width: 760px;
      }
      .time-grid {
        min-width: 760px;
        grid-template-columns: 170px minmax(590px, 1fr);
      }
    }
    @media (max-width: 420px) {
      .mobile-board-tabs {
        grid-template-columns: repeat(2, minmax(0, 1fr));

        width: 76px;
        min-width: 76px;
      }
      .mobile-task-list .time-left strong {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>

		  <script>
    const STORAGE_KEY = "zeitmanagement-tool-v3";
    const BOARD_PREFERENCES_KEY = "zeitmanagement-board-preferences-v1";
    const API_URL = ["localhost", "127.0.0.1", "::1"].includes(location.hostname)
      ? ""
      : "https://mad-design.de/mdr/api.php";
    const BROADCASTS = {
      aktuell: {
        label: "Aktuell",
        slots: ["17:45", "19:30", "21:45"],
        defaultDeadline: "17:15",
        timelineStart: 12,
        timelineEnd: 22,
      },
      mima: {
        label: "MiMa",
        slots: ["12:00–13:00", "13:05–14:00"],
        defaultDeadline: "11:45",
        timelineStart: 10,
        timelineEnd: 15,
      },
    };
    const BOARD_COLORS = {
      slate: { label: "Schiefer", accent: "#6f8295", rgb: "111, 130, 149" },
      blue: { label: "Nachtblau", accent: "#536f91", rgb: "83, 111, 145" },
      teal: { label: "Petrol", accent: "#4f7b78", rgb: "79, 123, 120" },
      olive: { label: "Olive", accent: "#727a58", rgb: "114, 122, 88" },
      plum: { label: "Pflaume", accent: "#80677f", rgb: "128, 103, 127" },
      rust: { label: "Terrakotta", accent: "#8b6658", rgb: "139, 102, 88" },
    };
    const TASK_COLORS = {
      neutral: { label: "Neutral", accent: "#45d483", swatch: "#2f3640", rgb: "37, 42, 50" },
      ...BOARD_COLORS,
    };
	    const COLUMNS = [
	      ["planning", "in Planung"],
	      ["animation", "in Arbeit"],
	      ["approval", "Abnahme"],
	      ["delivered", "Fertig"],
	    ];
    const COLUMN_ICONS = {
      planning: "clock",
      animation: "play",
      approval: "eye",
      delivered: "check",
    };
    const MOBILE_QUERY = "(max-width: 700px)";
    const TIMER_LABELS = { preparation: "Vorbereitung", animation: "in Arbeit" };
    let selectedSlot = "17:45";
    const initialBoardPreferences = loadBoardPreferences();
    let activeBroadcast = initialBoardPreferences.activeBroadcast;
    let boardColors = initialBoardPreferences.colors;
    let enabledBroadcasts = initialBoardPreferences.enabledBroadcasts;
    let boardPreferencesUpdatedAt = initialBoardPreferences.updatedAt;
	    let view = "board";
	    let editingId = null;
	    let stagedAttachments = [];
	    let stagedCoverImage = null;
	    let coverCropImage = null;
	    let coverCropFileName = "Titelbild.jpg";
    let galleryImages = [];
    let galleryIndex = 0;
    let mobileColumn = "planning";
    let deadlineAlertTaskId = null;
	    let analysisQuery = "";
    let now = new Date();
    let warned = new Set();
    let openDetailIds = new Set();
    let draggingTaskId = null;
    let lastArchiveDate = toLocalDate(new Date());
    let tasks = archiveCompletedTasks(loadTasks(), now);
    let syncStatus = { tone: "ok", text: "Server-Sync aktiv." };
    let syncTimer = null;
    let isSyncing = false;
    let pendingServerSave = false;
    let lastServerPull = 0;

    function uid() {
      return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    }
    function loadBoardPreferences() {
      try {
        const stored = JSON.parse(localStorage.getItem(BOARD_PREFERENCES_KEY) || "{}");
        const enabledBroadcasts = Array.isArray(stored.enabledBroadcasts)
          ? stored.enabledBroadcasts.filter(key => BROADCASTS[key])
          : Object.keys(BROADCASTS);
        const safeEnabledBroadcasts = enabledBroadcasts.length ? enabledBroadcasts : ["aktuell"];
        return {
          activeBroadcast: safeEnabledBroadcasts.includes(stored.activeBroadcast) ? stored.activeBroadcast : safeEnabledBroadcasts[0],
          enabledBroadcasts: safeEnabledBroadcasts,
          colors: {
            aktuell: BOARD_COLORS[stored.colors && stored.colors.aktuell] ? stored.colors.aktuell : "blue",
            mima: BOARD_COLORS[stored.colors && stored.colors.mima] ? stored.colors.mima : "teal",
            board: BOARD_COLORS[stored.colors && stored.colors.board] ? stored.colors.board : "teal",
          },
          updatedAt: stored.updatedAt || new Date(0).toISOString(),
        };
      } catch {
        return { activeBroadcast: "aktuell", enabledBroadcasts: Object.keys(BROADCASTS), colors: { aktuell: "blue", mima: "teal", board: "teal" }, updatedAt: new Date(0).toISOString() };
      }
    }
    function boardState() {
      return { activeBroadcast, enabledBroadcasts, colors: boardColors, updatedAt: boardPreferencesUpdatedAt };
    }
    function normalizeBoardState(state) {
      if (!state || !Array.isArray(state.enabledBroadcasts)) return null;
      const safeEnabledBroadcasts = state.enabledBroadcasts.filter(key => BROADCASTS[key]);
      if (!safeEnabledBroadcasts.length) return null;
      const colors = state.colors || {};
      return {
        activeBroadcast: safeEnabledBroadcasts.includes(state.activeBroadcast) ? state.activeBroadcast : safeEnabledBroadcasts[0],
        enabledBroadcasts: safeEnabledBroadcasts,
        colors: {
          aktuell: BOARD_COLORS[colors.aktuell] ? colors.aktuell : "blue",
          mima: BOARD_COLORS[colors.mima] ? colors.mima : "teal",
          board: BOARD_COLORS[colors.board] ? colors.board : "teal",
        },
        updatedAt: state.updatedAt || new Date(0).toISOString(),
      };
    }
    function applyBoardState(state) {
      const normalized = normalizeBoardState(state);
      if (!normalized || new Date(normalized.updatedAt).getTime() < new Date(boardPreferencesUpdatedAt).getTime()) return false;
      activeBroadcast = normalized.activeBroadcast;
      enabledBroadcasts = normalized.enabledBroadcasts;
      boardColors = normalized.colors;
      boardPreferencesUpdatedAt = normalized.updatedAt;
      localStorage.setItem(BOARD_PREFERENCES_KEY, JSON.stringify(boardState()));
      return true;
    }
    function serverBoardStateIsOlder(state) {
      const normalized = normalizeBoardState(state);
      if (!normalized) return true;
      return new Date(normalized.updatedAt).getTime() < new Date(boardPreferencesUpdatedAt).getTime();
    }
    function saveBoardPreferences({ touch = true } = {}) {
      if (touch) boardPreferencesUpdatedAt = new Date().toISOString();
      localStorage.setItem(BOARD_PREFERENCES_KEY, JSON.stringify(boardState()));
    }
	    function applyBoardColor() {
	      const colorKey = boardColors.board || boardColors[activeBroadcast] || "slate";
	      const color = BOARD_COLORS[colorKey];
	      document.documentElement.style.setProperty("--board-accent", color.accent);
	      document.documentElement.style.setProperty("--board-tint", color.rgb);
	    }
    function setBoardColor(colorKey) {
      if (!BOARD_COLORS[colorKey]) return;

    function renderTimeline() {
      const timelineStart = Math.min(...Object.values(BROADCASTS).map(broadcast => broadcast.timelineStart));
      const timelineEnd = Math.max(...Object.values(BROADCASTS).map(broadcast => broadcast.timelineEnd));
      const hours = Array.from({ length: timelineEnd - timelineStart + 1 }, (_, index) => timelineStart + index);
      const totalMinutes = (timelineEnd - timelineStart) * 60;
      const nowPosition = ((now.getHours() * 60 + now.getMinutes() - timelineStart * 60) / totalMinutes) * 100;
      const active = activeTasks();
      const urgent = active.filter(task => ["late", "critical", "tight"].includes(risk(task))).length;
      const nextTask = active[0];
      const nextDeadline = nextTask ? formatClock(nextTask.productionDeadline) : "-";
      const slots = [...new Set([
        ...Object.values(BROADCASTS).flatMap(broadcast => broadcast.slots),
        ...active.map(task => task.sendSlot),
      ])].sort((a, b) => sendSlotMinutes(a) - sendSlotMinutes(b));
      const visibleSlots = active.length ? slots.filter(slot => active.some(task => task.sendSlot === slot)) : slots;
      const mobileSummary = `<div class="mobile-timeline-summary">
        <div><span>${icon("screen")}</span><strong>${active.length}</strong></div>
        <div><span>${icon("alarm")}</span><strong>${nextDeadline}</strong></div>
        <div><span>${icon("stopwatch")}</span><strong>${urgent}</strong></div>
      </div>`;
      const mobileGroups = visibleSlots.map(slot => {
        const slotTasks = active.filter(task => task.sendSlot === slot)
          .sort((a, b) => new Date(a.productionDeadline) - new Date(b.productionDeadline));
        const items = slotTasks.map(task => {
            const state = risk(task);
            const created = new Date(task.createdAt).getTime();
            const deadline = new Date(task.productionDeadline).getTime();
            const progress = Math.max(4, Math.min(100, ((now.getTime() - created) / Math.max(deadline - created, 1)) * 100));
            const remaining = Math.max(0, Math.floor((deadline - now.getTime()) / 1000));
            const statusTitle = (COLUMNS.find(([key]) => key === task.workStatus) || [null, task.workStatus])[1];
            return `<article class="mobile-timeline-item ${state}">
              <div class="mobile-timeline-top">
                <h3>${escapeHtml(task.title)}</h3>
                <span class="mobile-status-pill">${escapeHtml(statusTitle)}</span>
              </div>
              ${task.coverImage ? `<button class="cover-image" data-action="view-file" data-id="${task.id}" data-file-id="${task.coverImage.id}" data-kind="cover" title="Titelbild ansehen" aria-label="Titelbild ansehen"><img src="${escapeHtml(task.coverImage.url)}" alt=""></button>` : ""}
              <div class="mobile-timeline-meta">
                <span title="Deadline" aria-label="Deadline">${icon("alarm")}${formatClock(task.productionDeadline)}</span>
                <span title="Restzeit" aria-label="Restzeit">${icon("clock")}${formatDuration(remaining)}</span>
                <span title="Erfasste Zeit" aria-label="Erfasste Zeit">${icon("stopwatch")}${formatDuration(sumSessions(task))}</span>
                ${(task.attachments || []).length ? `<span title="Dateien" aria-label="Dateien">${icon("paperclip")}${task.attachments.length}</span>` : ""}
              </div>
              <div class="mobile-progress" aria-hidden="true" style="--progress:${progress}%"><span></span></div>
              <div class="mobile-progress-labels"><span>${formatClock(task.createdAt)}</span><span>${formatClock(task.productionDeadline)}</span></div>
            </article>`;
          }).join("");
        return `<section class="mobile-slot">
          <div class="mobile-slot-head"><span>${icon("screen")}${escapeHtml(slot)}</span><strong>${slotTasks.length}</strong></div>
          <div class="mobile-slot-stack">${items || '<div class="empty">Leer</div>'}</div>
        </section>`;
      }).join("");
      const mobileRows = `<div class="mobile-timeline-list">${mobileSummary}${mobileGroups || '<div class="empty">Keine aktiven Animationen.</div>'}</div>`;
      const rows = active.map(task => {
        const deadline = new Date(task.productionDeadline);
        const deadlineMinutes = deadline.getHours() * 60 + deadline.getMinutes();
        const created = new Date(task.createdAt);
        const createdMinutes = created.getHours() * 60 + created.getMinutes();
        const startMinutes = Math.max(timelineStart * 60, Math.min(createdMinutes, deadlineMinutes));
        const left = ((startMinutes - timelineStart * 60) / totalMinutes) * 100;
        const width = ((deadlineMinutes - startMinutes) / totalMinutes) * 100;
        const sendLeft = ((sendSlotMinutes(task.sendSlot) - timelineStart * 60) / totalMinutes) * 100;
        const deadlineLeft = ((deadlineMinutes - timelineStart * 60) / totalMinutes) * 100;
        const state = risk(task);
        return `<div class="timeline-row">
          <div class="time-label"><strong>${escapeHtml(task.title)}</strong><span>${formatDuration(sumSessions(task))} erfasst</span></div>
          <div class="track">
            <div class="bar ${state}" style="left:${left}%;width:${Math.max(width, 8)}%">${riskLabel(state)}</div>
            <span class="pin" style="left:${deadlineLeft}%">Deadline ${formatClock(task.productionDeadline)}</span>
            <span class="pin send" style="left:${sendLeft}%">Sendung ${task.sendSlot}</span>
            ${nowPosition >= 0 && nowPosition <= 100 ? `<span class="now" style="left:${nowPosition}%"></span>` : ""}

        </div>
      </div>`;
    }

	      const x = Number(document.getElementById("cropX").value || 50) / 100;
	      const y = Number(document.getElementById("cropY").value || 50) / 100;
	      const baseScale = Math.max(canvas.width / coverCropImage.naturalWidth, canvas.height / coverCropImage.naturalHeight);
	      const scale = baseScale * zoom;
	      const sourceWidth = canvas.width / scale;
	      const sourceHeight = canvas.height / scale;
	      const sourceX = Math.max(0, (coverCropImage.naturalWidth - sourceWidth) * x);
	      const sourceY = Math.max(0, (coverCropImage.naturalHeight - sourceHeight) * y);
	      ctx.clearRect(0, 0, canvas.width, canvas.height);

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;
      for (let index = 0; index < text.length; index += 1) {
        const char = text[index];
        const next = text[index + 1];
        if (char === '"' && quoted && next === '"') {
          value += '"';
          index += 1;
        } else if (char === '"') {
          quoted = !quoted;
        } else if ((char === "," || char === ";") && !quoted) {
          row.push(value.trim());
          value = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") index += 1;
          row.push(value.trim());
          if (row.some(Boolean)) rows.push(row);
          row = [];
          value = "";
        } else {
          value += char;
        }
      }
      row.push(value.trim());
      if (row.some(Boolean)) rows.push(row);
      return rows;
    }
    function pickField(row, headers, names) {
      for (const name of names) {
        const index = headers.findIndex(header => normalizeText(header) === normalizeText(name));
        if (index >= 0 && row[index]) return row[index];
      }
      return "";
    }
    function parseDateInput(value) {
      const raw = String(value || "").trim();
      if (!raw) return toLocalDate(new Date());
      const german = raw.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
      if (german) {
        const year = german[3].length === 2 ? "20" + german[3] : german[3];
        return `${year}-${String(german[2]).padStart(2, "0")}-${String(german[1]).padStart(2, "0")}`;
      }
      const parsed = new Date(raw);
      if (!Number.isNaN(parsed.getTime())) return toLocalDate(parsed);
      return toLocalDate(new Date());
    }
    function parseTimeInput(value, fallback = "17:15") {
      const raw = String(value || "").trim();
      const match = raw.match(/(\d{1,2})[:.](\d{2})/);
      if (!match) return fallback;
      return `${String(match[1]).padStart(2, "0")}:${match[2]}`;
    }
    function mapStatus(value) {
      const text = normalizeText(value);
      if (text.includes("arbeit") || text.includes("progress")) return "animation";
      if (text.includes("abnahme") || text.includes("review")) return "approval";
      if (text.includes("fertig") || text.includes("bereit") || text.includes("done") || text.includes("complete")) return "delivered";
      return "planning";
    }
    function importCsvFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const rows = parseCsv(String(reader.result || ""));
          if (rows.length < 2) throw new Error("Die Datei enthält keine Aufgaben.");
          const headers = rows[0];
          const imported = rows.slice(1).map(row => {
            const broadcastKey = normalizeText(pickField(row, headers, ["Board", "Sendungstyp", "Format"])).includes("mima") ? "mima" : "aktuell";
            const broadcast = BROADCASTS[broadcastKey];
            const title = pickField(row, headers, ["Aufgabe", "Titel", "Title", "Task", "Name"]) || "Importierte Aufgabe";
            const date = parseDateInput(pickField(row, headers, ["Deadline-Datum", "Fälligkeitsdatum", "Due date", "Due", "Datum"]));
            const time = parseTimeInput(pickField(row, headers, ["Deadline-Zeit", "Uhrzeit", "Time", "Deadline"]), broadcast.defaultDeadline);
            const importedSlot = pickField(row, headers, ["Sendezeit", "Sendung", "Sendetermin"]);
            const sendSlot = broadcast.slots.includes(importedSlot) ? importedSlot : broadcast.slots[0];
            const status = mapStatus(pickField(row, headers, ["Bucket", "Status", "Spalte", "Progress"]));
            return normalizeTask({
              id: uid(),
              title,
	              broadcast: broadcastKey,
	              projectType: pickField(row, headers, ["Typ", "Type"]) || "ANIM",
              boardColor: "neutral",
              boardColorManual: false,
	              abbreviation: "PMY",
              source: "Teams",
              requester: pickField(row, headers, ["Auftrag von", "Auftraggeber", "Assigned to", "Zugewiesen an"]),
              description: pickField(row, headers, ["Notiz", "Beschreibung", "Description", "Notes"]),
              sendSlot,
              productionDeadline: combineDeadline(date, time),
              workStatus: status,
              activeTimer: null,
              sessions: [],
              createdAt: new Date().toISOString(),
              updatedAt: new Date().toISOString(),
              completedAt: status === "delivered" ? new Date().toISOString() : null,
              archivedAt: null,
            });
          });
          let added = 0;
          imported.forEach(task => {
            const duplicate = tasks.some(existing => !existing.deletedAt &&
              existing.broadcast === task.broadcast &&
              normalizeText(existing.title) === normalizeText(task.title) &&
              existing.productionDeadline === task.productionDeadline
            );
            if (!duplicate) {
              tasks.unshift(task);
              added += 1;
            }
          });
          save();
          render();
          alert(`${added} Aufgaben importiert. ${imported.length - added} Duplikate übersprungen.`);
        } catch (error) {
          alert("CSV konnte nicht importiert werden: " + error.message);
        }
      };
      reader.readAsText(file, "utf-8");
    }

	        }
	        if (button.dataset.action === "move") moveTask(button.dataset.id, button.dataset.status);
        if (button.dataset.action === "delete") deleteTask(button.dataset.id);
        if (button.dataset.action === "reactivate") reactivateTask(button.dataset.id);
        return;
      }
      if (event.target.id === "saveBackup") saveBackup();
      if (event.target.id === "loadBackup") document.getElementById("backupFile").click();
      if (event.target.id === "importCsv") document.getElementById("csvFile").click();
      if (event.target.id === "closeDay") archiveWorkday();
      if (event.target.id === "loadServer") loadFromServer();
      if (event.target.id === "saveServer") saveToServer();
    });
    document.getElementById("view").addEventListener("input", event => {
      if (event.target.id !== "analysisSearch") return;
      analysisQuery = event.target.value;
      if (view === "archive") renderArchive();
      else if (view === "analysis") renderAnalysis();
    });
    document.getElementById("view").addEventListener("toggle", event => {
      const details = event.target.closest("details[data-details-id]");
      if (!details) return;
      if (details.open) openDetailIds.add(details.dataset.detailsId);
      else openDetailIds.delete(details.dataset.detailsId);
    }, true);
    document.getElementById("view").addEventListener("dragstart", event => {
      const card = event.target.closest(".card");
      if (card) {
        draggingTaskId = card.dataset.id;
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/task-id", card.dataset.id);
      }
    });
    document.getElementById("view").addEventListener("dragend", () => {
      draggingTaskId = null;
    });
    document.getElementById("view").addEventListener("dragover", event => {
      if (event.target.closest(".column")) event.preventDefault();
    });
    document.getElementById("view").addEventListener("drop", event => {
      const column = event.target.closest(".column");
      if (!column) return;
      event.preventDefault();
      const id = event.dataTransfer.getData("text/task-id") || draggingTaskId;
      draggingTaskId = null;
      if (id) moveTask(id, column.dataset.column);
    });
    setInterval(() => {
      now = new Date();
      const today = toLocalDate(now);
      if (today !== lastArchiveDate) {
        lastArchiveDate = today;
        tasks = archiveCompletedTasks(tasks, now);
        save();
      }
      warnCritical();
      if (draggingTaskId) return;
      if (!shouldPauseLiveRender() && Date.now() - lastServerPull > 1000) {
        lastServerPull = Date.now();
        loadFromServer({ silent: true });
      }
      if (shouldPauseLiveRender()) return;
      render();
    }, 1000);

	    renderSlots();
	    updateNotificationButton("Notification" in window ? Notification.permission : "default");
	    render();
	    loadFromServer({ silent: true });
	    if ("serviceWorker" in navigator && location.protocol === "https:") {
	      navigator.serviceWorker.register("./sw.js").catch(() => {});
	    }
	  </script>
</body>
</html>
