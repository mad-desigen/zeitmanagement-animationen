<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeitmanagement</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root {
      --bg: #101214;
      --surface: #16191d;
      --panel: #1d2127;
      --panel-2: #242932;
      --panel-3: #2a303a;
      --line: #373f4b;
      --line-soft: rgba(255, 255, 255, .07);
      --text: #f4f6f8;
      --muted: #aeb6c2;
      --muted-2: #7f8895;
      --pink: #f05379;
      --blue: #2388ff;
      --yellow: #ffd84d;
      --green: #45d483;
      --orange: #e9b949;
      --shadow: 0 20px 60px rgba(0, 0, 0, .34);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(35, 136, 255, .10) 0, transparent 280px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
        var(--bg);
      background-size: auto, 80px 80px, auto;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    button {
      min-height: 40px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      font-weight: 750;
      padding: 9px 13px;
      transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
    }
    button:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.18);
      background: #2b323d;
    }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid rgba(35, 136, 255, .85);
      outline-offset: 2px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(16, 18, 20, .92);
      padding: 22px 28px 18px;
      backdrop-filter: blur(18px);
    }
    .header-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      max-width: 1600px;
      margin: 0 auto;
    }
    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(30px, 4vw, 50px);
      font-weight: 850;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 10px;
    }
    .metric {
      min-width: 120px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
      padding: 11px 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 20px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      max-width: 1600px;
      margin: 20px auto 0;
    }
    .add {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border-color: rgba(35, 136, 255, .85);
      background: linear-gradient(180deg, #2d94ff, #176fd8);
      color: white;
      box-shadow: 0 12px 30px rgba(35, 136, 255, .25);
    }
    .add span {
      font-size: 25px;
      line-height: 0;
      font-weight: 400;
    }
    .secondary {
      background: rgba(255,255,255,.045);
      color: var(--text);
    }
    .switch {
      display: inline-grid;
      grid-template-columns: repeat(3, minmax(105px, 1fr));
      overflow: hidden;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .switch button {
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: #c9c9c4;
    }
    .switch button:last-child { border-right: 0; }
    .switch button.active {
      background: var(--yellow);
      color: #111;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.18);
    }
    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px 28px 38px;
    }
    .learning {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .learning > div, .panel {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(29, 33, 39, .82);
      padding: 14px 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
    }
    .learning span {
      color: var(--muted);
      font-weight: 800;
    }
    .learning strong { float: right; }
    .board {
      display: grid;
      grid-auto-columns: minmax(300px, 1fr);
      grid-auto-flow: column;
      gap: 14px;
      min-height: calc(100vh - 220px);
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .column {
      overflow: hidden;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(22, 25, 29, .86);
      min-width: 300px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
    }
    .column-head {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line-soft);
      border-radius: var(--radius) var(--radius) 0 0;
      background: rgba(36, 41, 50, .96);
      padding: 13px 14px;
    }
    .column-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .01em;
    }
    .column-head span {
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: #d9d9d3;
      font-size: 12px;
      font-weight: 900;
      padding: 4px 8px;
    }
    .stack {
      display: grid;
      align-content: start;
      gap: 11px;
      min-height: 520px;
      padding: 12px;
    }
    .empty {
      border: 1px dashed rgba(255,255,255,.17);
      border-radius: var(--radius);
      color: #8f918e;
      font-size: 13px;
      font-weight: 800;
      padding: 18px;
      text-align: center;
      background: rgba(255,255,255,.025);
    }
    .card {
      position: relative;
      border: 1px solid rgba(255,255,255,.09);
      border-left: 5px solid var(--green);
      border-radius: var(--radius);
      background: linear-gradient(180deg, #252a32, #1c2026);
      cursor: grab;
      padding: 13px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.24);
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.16);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.32);
    }
    .card.tight { border-left-color: var(--orange); }
    .card.critical, .card.late { border-left-color: var(--pink); }
    .card.done { border-left-color: #666; }
    .card.critical {
      box-shadow: 0 0 0 2px rgba(240, 79, 120, .22), 0 10px 24px rgba(0, 0, 0, .22);
    }
    .card.late {
      animation: urgentPulse 1.4s ease-in-out infinite;
    }
    @keyframes urgentPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(240, 79, 120, .5), 0 10px 24px rgba(0, 0, 0, .22); }
      50% { box-shadow: 0 0 0 4px rgba(240, 79, 120, .18), 0 10px 24px rgba(0, 0, 0, .22); }
    }
    .kicker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .kicker span {
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: #dce2e8;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
    }
    .card h3 {
      margin: 9px 0 4px;
      font-size: 18px;
      line-height: 1.18;
      letter-spacing: 0;
    }
    .card p {
      margin: 6px 0 0;
      color: var(--muted);
    }
    .risk, .timer-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 12px;
    }
    .risk div, .timer {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      padding: 9px;
    }
    .risk span, .timer span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .risk strong, .timer strong {
      display: block;
      margin-top: 3px;
      font-size: 17px;
    }
    .timer {
      min-height: 54px;
      text-align: left;
    }
    .timer.active {
      border-color: var(--green);
      background: rgba(69, 212, 131, .16);
      box-shadow: inset 0 0 0 1px rgba(69, 212, 131, .18);
    }
    .wide-button {
      width: 100%;
      margin-top: 10px;
    }
    .split-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .split-actions button {
      width: 100%;
      margin-top: 0;
    }
    .stop { background: rgba(240, 83, 121, .14); }
    .folder { background: rgba(255,255,255,.06); }
    .note {
      border-left: 3px solid var(--orange);
      margin-top: 12px;
      padding-left: 10px;
    }
    .timeline-panel, .analysis-panel {
      overflow-x: auto;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(22, 25, 29, .9);
      box-shadow: var(--shadow);
    }
    .panel-head {
      display: flex;
      min-width: 920px;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--line-soft);
      padding: 14px 16px;
    }
    .panel-head h2 {
      margin: 0;
      font-size: 20px;
    }
    .time-grid {
      display: grid;
      min-width: 920px;
      grid-template-columns: 220px minmax(680px, 1fr);
    }
    .time-label {
      min-height: 58px;
      border-right: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
      background: rgba(36, 41, 50, .8);
      padding: 10px 12px;
    }
    .time-label strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .time-label span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }
    .scale {
      display: grid;
      min-height: 44px;
      grid-template-columns: repeat(11, minmax(60px, 1fr));
      border-bottom: 1px solid var(--line-soft);
      background: linear-gradient(90deg, rgba(255,255,255,.075) 1px, transparent 1px);
      background-size: 10% 100%;
    }
    .scale span {
      border-left: 1px solid var(--line-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      padding: 12px 8px;
    }
    .timeline-row { display: contents; }
    .track {
      position: relative;
      min-height: 58px;
      border-bottom: 1px solid var(--line-soft);
      background:
        linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px),
        repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0, rgba(255,255,255,.035) 8.33%, transparent 8.33%, transparent 16.66%);
      background-size: 10% 100%, auto;
    }
    .bar {
      position: absolute;
      top: 13px;
      min-width: 58px;
      height: 30px;
      overflow: hidden;
      border-radius: 6px;
      color: #07120c;
      font-size: 12px;
      font-weight: 900;
      line-height: 30px;
      padding: 0 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: var(--green);
      box-shadow: 0 10px 22px rgba(0,0,0,.24);
    }
    .bar.tight { background: var(--orange); color: #1f1603; }
    .bar.critical, .bar.late { background: var(--pink); color: white; }
    .pin {
      position: absolute;
      z-index: 2;
      top: 4px;
      border-left: 2px solid var(--text);
      color: var(--text);
      font-size: 11px;
      font-weight: 900;
      padding-left: 5px;
      white-space: nowrap;
    }
    .pin.send {
      top: auto;
      bottom: 4px;
      border-left-color: #58b8ff;
      color: #9dd7ff;
    }
    .now {
      position: absolute;
      inset: 0 auto 0 0;
      z-index: 1;
      width: 2px;
      background: #ffffff;
      box-shadow: 0 0 18px rgba(255,255,255,.55);
    }
    .analysis-summary {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .analysis-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .analysis-tools input {
      min-width: min(360px, 100%);
      flex: 1;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      color: var(--text);
      padding: 10px 11px;
    }
    .table { min-width: 980px; }
    .row {
      display: grid;
      grid-template-columns: minmax(220px, 1.4fr) repeat(6, minmax(110px, 1fr));
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid var(--line-soft);
      padding: 12px 16px;
    }
    .row:not(.head):hover {
      background: rgba(255,255,255,.035);
    }
    .row.head span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .row small {
      display: block;
      color: var(--muted);
      margin-top: 3px;
    }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      background: rgba(0,0,0,.72);
      padding: 20px;
      backdrop-filter: blur(10px);
    }
    .modal.open { display: grid; }
    .dialog {
      width: min(620px, 100%);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--radius);
      background: #20252d;
      padding: 20px;
      box-shadow: 0 28px 90px rgba(0,0,0,.48);
    }
    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .dialog h2 { margin: 0; }
    .form {
      display: grid;
      gap: 12px;
    }
    .form label {
      display: grid;
      gap: 6px;
      color: #cbd3dd;
      font-size: 13px;
      font-weight: 800;
    }
    .form input, .form select, .form textarea {
      width: 100%;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      color: var(--text);
      padding: 10px 11px;
      outline: none;
    }
    .form input:focus, .form select:focus, .form textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(35, 136, 255, .2);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .slots {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .slot.active {
      border-color: var(--yellow);
      background: var(--yellow);
      color: #111;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }
    .primary {
      border-color: var(--pink);
      background: linear-gradient(180deg, #ff5c85, #d83b65);
      color: white;
    }
    .hint {
      color: var(--muted);
      font-size: 12px;
      margin: 12px 0 0;
    }
    .suggestion {
      display: none;
      border: 1px solid #51482a;
      border-radius: 8px;
      background: #2b2616;
      color: #ffe8a3;
      font-size: 13px;
      font-weight: 800;
      padding: 10px 11px;
    }
    .suggestion.visible { display: block; }
    @media (max-width: 900px) {
      .header-row { align-items: stretch; flex-direction: column; }
      .metrics, .learning, .analysis-summary, .grid-2 { grid-template-columns: 1fr; }
      .switch { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <h1>Zeitmanagement</h1>
      <div class="metrics" id="metrics"></div>
    </div>
    <div class="actions">
      <button class="add" id="openDialog"><span>+</span> Aufgabe hinzufügen</button>
      <button class="secondary" id="importCsv">CSV importieren</button>
      <button class="secondary" id="saveBackup">Backup speichern</button>
      <button class="secondary" id="loadBackup">Backup laden</button>
      <button class="secondary" id="closeDay">Arbeitstag abschließen</button>
      <div class="switch" aria-label="Ansicht wechseln">
        <button class="active" data-view="board">Kanban</button>
        <button data-view="timeline">Timeline</button>
        <button data-view="analysis">Analyse</button>
      </div>
      <button id="notify">Benachrichtigungen aktivieren</button>
      <input id="csvFile" type="file" accept=".csv,.txt" hidden>
      <input id="backupFile" type="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <main>
    <section class="learning" id="learning"></section>
    <section id="view"></section>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Aufgabe hinzufügen">
    <div class="dialog">
      <div class="dialog-head">
          <h2 id="dialogTitle">Aufgabe hinzufügen</h2>
        <button id="closeDialog" aria-label="Schließen">x</button>
      </div>
      <div class="form">
        <label>Aufgabe <input id="title" value="Animation"></label>
        <div class="grid-2">
          <label>Typ
            <select id="projectType">
              <option>ANIM</option>
              <option>INFO</option>
              <option>KARTE</option>
            </select>
          </label>
          <label>Kürzel <input id="abbreviation"></label>
        </div>
        <div class="grid-2">
          <label>Auftrag von <input id="requester"></label>
          <label>Quelle
            <select id="source">
              <option>Formular</option>
              <option>Mail</option>
              <option>Mündlich</option>
              <option>Teams</option>
              <option>Sonstiges</option>
            </select>
          </label>
        </div>
        <label>Sendezeit
          <div class="slots" id="slots"></div>
        </label>
        <div class="grid-2">
          <label>Deadline-Datum <input type="date" id="deadlineDate"></label>
          <label>Deadline-Zeit <input type="time" id="deadlineTime" value="17:15"></label>
        </div>
          <label>Notiz <textarea id="description" rows="4"></textarea></label>
          <div class="suggestion" id="timeSuggestion"></div>
      </div>
      <p class="hint">Die Daten werden lokal in diesem Browser gespeichert. Keine Anmeldung, keine Installation.</p>
      <div class="modal-actions">
        <button id="cancel">Abbrechen</button>
        <button class="primary" id="create">Animation anlegen</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "zeitmanagement-tool-v3";
    const SEND_SLOTS = ["17:45", "19:30", "21:45"];
    const COLUMNS = [
      ["planning", "in Planung"],
      ["animation", "in Arbeit"],
      ["approval", "Abnahme"],
      ["delivered", "Fertig"],
    ];
    const TIMER_LABELS = { preparation: "Vorbereitung", animation: "in Arbeit" };
    const DAY_START = 12;
    const DAY_END = 22;
    let selectedSlot = "17:45";
    let view = "board";
    let editingId = null;
    let analysisQuery = "";
    let now = new Date();
    let warned = new Set();
    let lastArchiveDate = toLocalDate(new Date());
    let tasks = archiveCompletedTasks(loadTasks(), now);

    function uid() {
      return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    }
    function toLocalDate(date) {
      const offset = date.getTimezoneOffset() * 60000;
      return new Date(date.getTime() - offset).toISOString().slice(0, 10);
    }
    function localDateFromIso(value) {
      return toLocalDate(new Date(value));
    }
    function combineDeadline(date, time) {
      return date + "T" + (time || "17:15");
    }
    function secondsBetween(start, end = new Date().toISOString()) {
      return Math.max(0, Math.floor((new Date(end).getTime() - new Date(start).getTime()) / 1000));
    }
    function formatDuration(seconds) {
      const minutes = Math.round(seconds / 60);
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return h === 0 ? m + "m" : h + "h " + String(m).padStart(2, "0") + "m";
    }
    function formatClock(value) {
      return new Intl.DateTimeFormat("de-DE", { hour: "2-digit", minute: "2-digit" }).format(new Date(value));
    }
    function formatDateTime(value) {
      return new Intl.DateTimeFormat("de-DE", {
        day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit"
      }).format(new Date(value));
    }
    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }
    function normalizeText(value) {

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;
      for (let index = 0; index < text.length; index += 1) {
        const char = text[index];
        const next = text[index + 1];
        if (char === '"' && quoted && next === '"') {
          value += '"';
          index += 1;
        } else if (char === '"') {
          quoted = !quoted;
        } else if ((char === "," || char === ";") && !quoted) {
          row.push(value.trim());
          value = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") index += 1;
          row.push(value.trim());
          if (row.some(Boolean)) rows.push(row);
          row = [];
          value = "";
        } else {
          value += char;
        }
      }
      row.push(value.trim());
      if (row.some(Boolean)) rows.push(row);
      return rows;
    }
    function pickField(row, headers, names) {

      return "";

      const raw = String(value || "").trim();
      if (!raw) return toLocalDate(new Date());

      if (german) {
        const year = german[3].length === 2 ? "20" + german[3] : german[3];
        return `${year}-${String(german[2]).padStart(2, "0")}-${String(german[1]).padStart(2, "0")}`;
      }
      const parsed = new Date(raw);
      if (!Number.isNaN(parsed.getTime())) return toLocalDate(parsed);
      return toLocalDate(new Date());
    }
    function parseTimeInput(value, fallback = "17:15") {
      const raw = String(value || "").trim();
      const match = raw.match(/(\d{1,2})[:.](\d{2})/);
      if (!match) return fallback;
      return `${String(match[1]).padStart(2, "0")}:${match[2]}`;

      const text = normalizeText(value);
      if (text.includes("arbeit") || text.includes("progress")) return "animation";
      if (text.includes("abnahme") || text.includes("review")) return "approval";
      if (text.includes("fertig") || text.includes("bereit") || text.includes("done") || text.includes("complete")) return "delivered";

            const sendSlot = parseTimeInput(pickField(row, headers, ["Sendezeit", "Sendung", "Sendetermin"]), "17:45");
            const status = mapStatus(pickField(row, headers, ["Bucket", "Status", "Spalte", "Progress"]));
            return normalizeTask({

          save();
          render();
          alert(`${added} Aufgaben importiert. ${imported.length - added} Duplikate übersprungen.`);
        } catch (error) {
          alert("CSV konnte nicht importiert werden: " + error.message);
        }
      };
      reader.readAsText(file, "utf-8");
    }
    async function enableNotifications() {
      if (!("Notification" in window)) return alert("Dieser Browser unterstützt keine Benachrichtigungen.");
      const permission = await Notification.requestPermission();
      document.getElementById("notify").textContent = permission === "granted" ? "Benachrichtigungen aktiv" : "Benachrichtigungen aktivieren";
    }
    function warnCritical() {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      activeTasks().forEach(task => {
        const minutesLeft = Math.floor((new Date(task.productionDeadline).getTime() - now.getTime()) / 60000);
        const state = risk(task);
        const key = `${task.id}-${state}-${minutesLeft}`;
        const shouldWarn = state === "critical" || minutesLeft === 30 || minutesLeft === 15 || minutesLeft === 5;
        if (!shouldWarn || warned.has(key)) return;
        warned.add(key);
        new Notification(`Zeitkritisch: ${task.title}`, {
          body: `${riskLabel(state)}. Deadline ${formatClock(task.productionDeadline)}, Sendung ${task.sendSlot}.`,
        });
      });
    }

    document.getElementById("openDialog").addEventListener("click", () => openDialog());
    document.getElementById("closeDialog").addEventListener("click", closeDialog);
    document.getElementById("cancel").addEventListener("click", closeDialog);
    document.getElementById("create").addEventListener("click", createTask);
    document.getElementById("notify").addEventListener("click", enableNotifications);
    document.getElementById("saveBackup").addEventListener("click", saveBackup);
    document.getElementById("loadBackup").addEventListener("click", () => document.getElementById("backupFile").click());
    document.getElementById("importCsv").addEventListener("click", () => document.getElementById("csvFile").click());
    document.getElementById("closeDay").addEventListener("click", archiveWorkday);
    document.getElementById("backupFile").addEventListener("change", event => {
      const file = event.target.files && event.target.files[0];
      if (file) loadBackupFile(file);
      event.target.value = "";
    });
    document.getElementById("csvFile").addEventListener("change", event => {
      const file = event.target.files && event.target.files[0];
      if (file) importCsvFile(file);
      event.target.value = "";
    });
    document.getElementById("title").addEventListener("input", updateSuggestion);
    document.querySelector(".switch").addEventListener("click", event => {
      const button = event.target.closest("button[data-view]");
      if (!button) return;
      view = button.dataset.view;
      render();
    });
    document.getElementById("slots").addEventListener("click", event => {
      const button = event.target.closest("button[data-slot]");
      if (!button) return;
      selectedSlot = button.dataset.slot;
      renderSlots();
    });
    document.getElementById("view").addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      if (button.dataset.action === "timer") startTimer(button.dataset.id, button.dataset.kind);
      if (button.dataset.action === "stop") stopTimer(button.dataset.id);
      if (button.dataset.action === "folder") downloadFolder(button.dataset.id);
      if (button.dataset.action === "edit") openDialog(button.dataset.id);
    });
    document.getElementById("view").addEventListener("input", event => {
      if (event.target.id !== "analysisSearch") return;
      analysisQuery = event.target.value;
      renderAnalysis();
    });
    document.getElementById("view").addEventListener("dragstart", event => {
      const card = event.target.closest(".card");
      if (card) event.dataTransfer.setData("text/task-id", card.dataset.id);
    });
    document.getElementById("view").addEventListener("dragover", event => {
      if (event.target.closest(".column")) event.preventDefault();
    });
    document.getElementById("view").addEventListener("drop", event => {
      const column = event.target.closest(".column");
      if (!column) return;
      event.preventDefault();
      const id = event.dataTransfer.getData("text/task-id");
      if (id) moveTask(id, column.dataset.column);
    });
    setInterval(() => {
      now = new Date();
      const today = toLocalDate(now);
      if (today !== lastArchiveDate) {
        lastArchiveDate = today;
        tasks = archiveCompletedTasks(tasks, now);
        save();
      }
      warnCritical();
      render();
    }, 1000);

    renderSlots();
    save();
    render();
  </script>
</body>
</html>
