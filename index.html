<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zeitmanagement</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root {
      --bg: #101214;
      --surface: #16191d;
      --panel: #1d2127;
      --panel-2: #242932;
      --panel-3: #2a303a;
      --line: #373f4b;
      --line-soft: rgba(255, 255, 255, .07);
      --text: #f4f6f8;
      --muted: #aeb6c2;
      --muted-2: #7f8895;
      --pink: #f05379;
      --blue: #2388ff;
      --yellow: #ffd84d;
      --green: #45d483;
      --orange: #e9b949;
      --shadow: 0 20px 60px rgba(0, 0, 0, .34);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(35, 136, 255, .10) 0, transparent 280px),
        var(--bg);
      background-size: auto, auto;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
      line-height: 1.45;
    }
    button, input, select, textarea { font: inherit; }
    button {
      min-height: 40px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      font-weight: 750;
      padding: 9px 13px;
      transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
    }
    button:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.18);
      background: #2b323d;
    }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid rgba(35, 136, 255, .85);
      outline-offset: 2px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(16, 18, 20, .92);
      padding: 22px 28px 18px;
      backdrop-filter: blur(18px);
    }
    .header-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      max-width: 1600px;
      margin: 0 auto;
    }
    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(30px, 4vw, 50px);
      font-weight: 850;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 10px;
    }
    .metric {
      min-width: 120px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
      padding: 11px 12px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 20px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      max-width: 1600px;
      margin: 20px auto 0;
    }
    .add {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border-color: rgba(35, 136, 255, .85);
      background: linear-gradient(180deg, #2d94ff, #176fd8);
      color: white;
      box-shadow: 0 12px 30px rgba(35, 136, 255, .25);
    }
    .add span {
      font-size: 25px;
      line-height: 0;
      font-weight: 400;
    }
    .secondary {
      background: rgba(255,255,255,.045);
      color: var(--text);
    }
    .icon-button {
      width: 42px;
      min-width: 42px;
      display: inline-grid;
      place-items: center;
      padding: 8px;
    }
    .icon-button svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-button.active {
      border-color: var(--yellow);
      background: var(--yellow);
      color: #151515;
    }
    .mono-icon {
      --icon-size: 16px;
      position: relative;
      display: inline-block;
      width: var(--icon-size);
      height: var(--icon-size);
      color: currentColor;
      flex: 0 0 auto;
    }
    .mono-icon.clock,
    .mono-icon.alarm,
    .mono-icon.stopwatch {
      border: 2px solid currentColor;
      border-radius: 50%;
    }
    .mono-icon.clock::before,
    .mono-icon.alarm::before,
    .mono-icon.stopwatch::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 3px;
      width: 2px;
      height: 5px;
      background: currentColor;
      border-radius: 999px;
      transform: translateX(-50%);
    }
    .mono-icon.clock::after,
    .mono-icon.alarm::after,
    .mono-icon.stopwatch::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 5px;
      height: 2px;
      background: currentColor;
      border-radius: 999px;
      transform-origin: left center;
      transform: rotate(18deg);
    }
    .mono-icon.alarm {
      --icon-size: 18px;
    }
    .mono-icon.alarm::before {
      top: -4px;
      width: 8px;
      height: 3px;
      border-radius: 3px;
    }
    .mono-icon.screen {
      width: 18px;
      height: 14px;
      border: 2px solid currentColor;
      border-radius: 4px;
    }
    .mono-icon.screen::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -5px;
      width: 9px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
      transform: translateX(-50%);
    }
    .mono-icon.play {
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 14px solid currentColor;
    }
    .mono-icon.pause {
      width: 18px;
      height: 20px;
      border-left: 6px solid currentColor;
      border-right: 6px solid currentColor;
    }
    .mono-icon.pencil::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 0;
      width: 5px;
      height: 17px;
      border: 2px solid currentColor;
      border-radius: 3px;
      transform: rotate(45deg);
    }
    .mono-icon.folder {
      width: 19px;
      height: 15px;
      border: 2px solid currentColor;
      border-radius: 3px;
    }
    .mono-icon.folder::before {
      content: "";
      position: absolute;
      left: 2px;
      top: -5px;
      width: 8px;
      height: 5px;
      border: 2px solid currentColor;
      border-bottom: 0;
      border-radius: 3px 3px 0 0;
      background: transparent;
    }
    .switch {
      display: inline-grid;
      grid-template-columns: repeat(5, minmax(105px, 1fr));
      overflow: hidden;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .switch button {
      border: 0;
      border-right: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: #c9c9c4;
    }
    .switch button:last-child { border-right: 0; }
    .switch button.active {
      background: var(--yellow);
      color: #111;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.18);
    }
    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px 28px 38px;
    }
    .learning {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .learning > div, .panel {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(29, 33, 39, .82);
      padding: 14px 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
    }
    .learning span {
      color: var(--muted);
      font-weight: 800;
    }
    .learning strong { float: right; }
    .board {
      display: grid;
      grid-auto-columns: minmax(300px, 1fr);
      grid-auto-flow: column;
      gap: 14px;
      min-height: calc(100vh - 220px);
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .column {
      overflow: hidden;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(22, 25, 29, .86);
      min-width: 300px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
    }
    .column-head {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line-soft);
      border-radius: var(--radius) var(--radius) 0 0;
      background: rgba(36, 41, 50, .96);
      padding: 13px 14px;
    }
    .column-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .01em;
    }
    .column-head span {
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: #d9d9d3;
      font-size: 12px;
      font-weight: 900;
      padding: 4px 8px;
    }
    .stack {
      display: grid;
      align-content: start;
      gap: 11px;
      min-height: 520px;
      padding: 12px;
    }
    .empty {
      border: 1px dashed rgba(255,255,255,.17);
      border-radius: var(--radius);
      color: #8f918e;
      font-size: 13px;
      font-weight: 800;
      padding: 18px;
      text-align: center;
      background: rgba(255,255,255,.025);
    }
    .card {
      position: relative;
      border: 1px solid rgba(255,255,255,.09);
      border-left: 5px solid var(--green);
      border-radius: var(--radius);
      background: linear-gradient(180deg, #252a32, #1c2026);
      cursor: grab;
      padding: 14px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.24);
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,.16);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.32);
    }
    .card.tight { border-left-color: var(--orange); }
    .card.critical, .card.late { border-left-color: var(--pink); }
    .card.done { border-left-color: #666; }
    .card.critical {
      box-shadow: 0 0 0 2px rgba(240, 79, 120, .22), 0 10px 24px rgba(0, 0, 0, .22);
    }
    .card.late {
      animation: urgentPulse 1.4s ease-in-out infinite;
    }
    @keyframes urgentPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(240, 79, 120, .5), 0 10px 24px rgba(0, 0, 0, .22); }
      50% { box-shadow: 0 0 0 4px rgba(240, 79, 120, .18), 0 10px 24px rgba(0, 0, 0, .22); }
    }
    .card-main {
      display: grid;
      gap: 12px;
    }
    .card-title-row {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }
    .card-title-row h3 {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      line-height: 1.06;
      letter-spacing: 0;
    }
    .deadline-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: #eef2f6;
      font-size: 12px;
      font-weight: 900;
      padding: 6px 9px;
      white-space: nowrap;
    }
    .card-focus {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: stretch;
    }
    .play-cluster {
      display: grid;
      gap: 5px;
      justify-items: center;
      align-content: center;
    }
    .time-left {
      border: 1px solid rgba(255,255,255,.1);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      padding: 10px 12px;
    }
    .time-left span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .time-left strong {
      display: block;
      margin-top: 4px;
      font-size: 28px;
      line-height: 1;
    }
    .play-button {
      min-width: 78px;
      min-height: 66px;
      border-color: rgba(56, 193, 114, .7);
      background: linear-gradient(180deg, #40d17c, #219653);
      color: #07120c;
      font-size: 0;
      box-shadow: 0 14px 28px rgba(56, 193, 114, .18);
    }
    .play-button::before {
      content: "";
      display: inline-block;
      width: 0;
      height: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 18px solid currentColor;
      margin-left: 4px;
      vertical-align: middle;
    }
    .play-button.active {
      border-color: rgba(240, 79, 120, .8);
      background: linear-gradient(180deg, #ff6a8f, #d73562);
      color: white;
    }
    .play-button.active::before {
      width: 18px;
      height: 22px;
      border: 0;
      border-left: 6px solid currentColor;
      border-right: 6px solid currentColor;
      margin-left: 0;
    }
    .card-subline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .card-subline span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .card-subline .deadline-pill {
      margin-left: auto;
      color: #eef2f6;
    }
    .details-toggle {
      display: grid;
      place-items: center;
      min-height: 34px;
      border-color: rgba(255,255,255,.08);
      background: rgba(255,255,255,.035);
      color: var(--muted);
      font-size: 12px;
      padding: 6px 9px;
      text-align: center;
    }
    .details-toggle::before {
      content: "⌄";
      color: currentColor;
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
    }
    .card details {
      margin-top: 10px;
    }
    .card summary {
      list-style: none;
    }
    .card summary::-webkit-details-marker {
      display: none;
    }
    .card details[open] .details-toggle {
      color: var(--text);
      background: rgba(255,255,255,.07);
    }
    .card details[open] .details-toggle::before {
      content: "⌃";
    }
    .card-details {
      display: grid;
      gap: 10px;
      border-top: 1px solid rgba(255,255,255,.08);
      margin-top: 10px;
      padding-top: 10px;
    }
    .kicker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .kicker span {
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: #dce2e8;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
    }
    .card p {
      margin: 6px 0 0;
      color: var(--muted);
    }
    .risk, .timer-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 12px;
    }
    .risk div, .timer {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      padding: 9px;
    }
    .risk span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .risk strong, .timer strong {
      display: block;
      margin-top: 3px;
      font-size: 17px;
    }
    .timer {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
    }
    .timer.active {
      border-color: var(--yellow);
      background: rgba(255, 216, 77, .16);
      box-shadow: inset 0 0 0 1px rgba(255, 216, 77, .25);
    }
    .split-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .split-actions button {
      width: 100%;
      margin-top: 0;
    }
    .card-icon-button {
      display: grid;
      place-items: center;
      min-height: 42px;
      font-size: 20px;
      line-height: 1;
    }
    .folder { background: rgba(255,255,255,.06); }
    .note {
      border-left: 3px solid var(--orange);
      margin-top: 12px;
      padding-left: 10px;
    }
    .timeline-panel, .analysis-panel {
      overflow-x: auto;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: #16191d;
      box-shadow: var(--shadow);
    }
    .panel-head {
      display: flex;
      min-width: 920px;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--line-soft);
      padding: 14px 16px;
    }
    .panel-head h2 {
      margin: 0;
      font-size: 20px;
    }
    .time-grid {
      display: grid;
      min-width: 920px;
      grid-template-columns: 220px minmax(680px, 1fr);
    }
    .time-label {
      min-height: 58px;
      border-right: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
      background: rgba(36, 41, 50, .8);
      padding: 10px 12px;
    }
    .time-label strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .time-label span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }
    .scale {
      display: grid;
      min-height: 44px;
      grid-template-columns: repeat(11, minmax(60px, 1fr));
      border-bottom: 1px solid var(--line-soft);
      background: #171b21;
    }
    .scale span {
      border-left: 1px solid var(--line-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      padding: 12px 8px;
    }
    .timeline-row { display: contents; }
    .track {
      position: relative;
      min-height: 58px;
      border-bottom: 1px solid var(--line-soft);
      background:
        repeating-linear-gradient(
          90deg,
          #171b21 0,
          #171b21 calc(10% - 1px),
          rgba(255,255,255,.07) calc(10% - 1px),
          rgba(255,255,255,.07) 10%
        );
    }
    .bar {
      position: absolute;
      top: 13px;
      min-width: 58px;
      height: 30px;
      overflow: hidden;
      border-radius: 6px;
      color: #07120c;
      font-size: 12px;
      font-weight: 900;
      line-height: 30px;
      padding: 0 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: var(--green);
      box-shadow: 0 10px 22px rgba(0,0,0,.24);
    }
    .bar.tight { background: var(--orange); color: #1f1603; }
    .bar.critical, .bar.late { background: var(--pink); color: white; }
    .pin {
      position: absolute;
      z-index: 2;
      top: 4px;
      border-left: 2px solid var(--text);
      color: var(--text);
      font-size: 11px;
      font-weight: 900;
      padding-left: 5px;
      white-space: nowrap;
    }
    .pin.send {
      top: auto;
      bottom: 4px;
      border-left-color: #58b8ff;
      color: #9dd7ff;
    }
    .now {
      position: absolute;
      inset: 0 auto 0 0;
      z-index: 1;
      width: 2px;
      background: #ffffff;
      box-shadow: 0 0 18px rgba(255,255,255,.55);
    }
    .analysis-summary {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .analysis-tools,
    .settings-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .analysis-tools input {
      min-width: min(360px, 100%);
      flex: 1;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      color: var(--text);
      padding: 10px 11px;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .settings-card {
      border: 1px solid #353535;
      border-radius: 8px;
      background: #1f1f1f;
      padding: 16px;
    }
    .settings-card h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }
    .settings-card p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.45;
    }
    .settings-card label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .settings-card input {
      width: 100%;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      color: var(--text);
      padding: 10px 11px;
    }
    .sync-status {
      min-height: 20px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .sync-status.ok { color: var(--green); }
    .sync-status.warn { color: var(--orange); }
    .sync-status.error { color: var(--pink); }
    .table { min-width: 980px; }
    .row {
      display: grid;
      grid-template-columns: minmax(220px, 1.4fr) repeat(6, minmax(110px, 1fr));
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid var(--line-soft);
      padding: 12px 16px;
    }
    .row:not(.head):hover {
      background: rgba(255,255,255,.035);
    }
    .row.head span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .row small {
      display: block;
      color: var(--muted);
      margin-top: 3px;
    }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      background: rgba(0,0,0,.72);
      padding: 20px;
      backdrop-filter: blur(10px);
    }
    .modal.open { display: grid; }
    .dialog {
      width: min(620px, 100%);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: var(--radius);
      background: #20252d;
      padding: 20px;
      box-shadow: 0 28px 90px rgba(0,0,0,.48);
    }
    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .dialog h2 { margin: 0; }
    .form {
      display: grid;
      gap: 12px;
    }
    .form label {
      display: grid;
      gap: 6px;
      color: #cbd3dd;
      font-size: 13px;
      font-weight: 800;
    }
    .form input, .form select, .form textarea {
      width: 100%;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: rgba(255,255,255,.045);
      color: var(--text);
      padding: 10px 11px;
      outline: none;
    }
    .form input:focus, .form select:focus, .form textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(35, 136, 255, .2);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .slots {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .slot.active {
      border-color: var(--yellow);
      background: var(--yellow);
      color: #111;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }
    .primary {
      border-color: var(--pink);
      background: linear-gradient(180deg, #ff5c85, #d83b65);
      color: white;
    }
    .hint {
      color: var(--muted);
      font-size: 12px;
      margin: 12px 0 0;
    }
    .suggestion {
      display: none;
      border: 1px solid #51482a;
      border-radius: 8px;
      background: #2b2616;
      color: #ffe8a3;
      font-size: 13px;
      font-weight: 800;
      padding: 10px 11px;
    }
    .suggestion.visible { display: block; }
    @media (max-width: 900px) {
      .header-row { align-items: stretch; flex-direction: column; }
      .metrics, .learning, .analysis-summary, .grid-2, .settings-grid { grid-template-columns: 1fr; }
      .switch { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <h1>Zeitmanagement</h1>
      <div class="metrics" id="metrics"></div>
    </div>
    <div class="actions">
      <button class="add" id="openDialog"><span>+</span> Aufgabe hinzufügen</button>
      <div class="switch" aria-label="Ansicht wechseln">
        <button class="active" data-view="board">Kanban</button>
        <button data-view="timeline">Timeline</button>
        <button data-view="analysis">Analyse</button>
        <button data-view="archive">Archiv</button>
        <button data-view="settings">Einstellungen</button>
      </div>
      <button class="icon-button" id="notify" title="Benachrichtigungen aktivieren" aria-label="Benachrichtigungen aktivieren">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
          <path d="M10 21h4"></path>
        </svg>
      </button>
      <input id="csvFile" type="file" accept=".csv,.txt" hidden>
      <input id="backupFile" type="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <main>
    <section class="learning" id="learning"></section>
    <section id="view"></section>
  </main>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Aufgabe hinzufügen">
    <div class="dialog">
      <div class="dialog-head">
          <h2 id="dialogTitle">Aufgabe hinzufügen</h2>
        <button id="closeDialog" aria-label="Schließen">x</button>
      </div>
      <div class="form">
        <label>Aufgabe <input id="title" value="Animation"></label>
        <div class="grid-2">
          <label>Typ
            <select id="projectType">
              <option>ANIM</option>
              <option>INFO</option>
              <option>KARTE</option>
            </select>
          </label>
          <label>Kürzel <input id="abbreviation"></label>
        </div>
        <div class="grid-2">
          <label>Auftrag von <input id="requester"></label>
          <label>Quelle
            <select id="source">
              <option>Formular</option>
              <option>Mail</option>
              <option>Mündlich</option>
              <option>Teams</option>
              <option>Sonstiges</option>
            </select>
          </label>
        </div>
        <label>Sendezeit
          <div class="slots" id="slots"></div>
        </label>
        <div class="grid-2">
          <label>Deadline-Datum <input type="date" id="deadlineDate"></label>
          <label>Deadline-Zeit <input type="time" id="deadlineTime" value="17:15"></label>
        </div>
          <label>Notiz <textarea id="description" rows="4"></textarea></label>
          <div class="suggestion" id="timeSuggestion"></div>
      </div>
      <p class="hint">Die Daten werden lokal in diesem Browser gespeichert. Keine Anmeldung, keine Installation.</p>
      <div class="modal-actions">
        <button id="cancel">Abbrechen</button>
        <button class="primary" id="create">Animation anlegen</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "zeitmanagement-tool-v3";
    const SYNC_KEY = "zeitmanagement-github-sync-v1";
    const GITHUB_OWNER = "mad-desigen";
    const GITHUB_REPO = "zeitmanagement-animationen";
    const GITHUB_BRANCH = "main";
    const GITHUB_DATA_PATH = "data/tasks.json";
    const SEND_SLOTS = ["17:45", "19:30", "21:45"];
    const COLUMNS = [
      ["planning", "in Planung"],
      ["animation", "in Arbeit"],
      ["approval", "Abnahme"],
      ["delivered", "Fertig"],
    ];
    const TIMER_LABELS = { preparation: "Vorbereitung", animation: "in Arbeit" };
    const DAY_START = 12;
    const DAY_END = 22;
    let selectedSlot = "17:45";
    let view = "board";
    let editingId = null;
    let analysisQuery = "";
    let now = new Date();
    let warned = new Set();
    let openDetailIds = new Set();
    let draggingTaskId = null;
    let lastArchiveDate = toLocalDate(new Date());
    let tasks = archiveCompletedTasks(loadTasks(), now);
    let syncSettings = loadSyncSettings();
    let syncStatus = { tone: "", text: "GitHub-Sync nicht eingerichtet." };
    let syncTimer = null;
    let isSyncing = false;

    function uid() {
      return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    }
    function toLocalDate(date) {
      const offset = date.getTimezoneOffset() * 60000;
      return new Date(date.getTime() - offset).toISOString().slice(0, 10);
    }
    function localDateFromIso(value) {
      return toLocalDate(new Date(value));
    }
    function combineDeadline(date, time) {
      return date + "T" + (time || "17:15");
    }
    function secondsBetween(start, end = new Date().toISOString()) {
      return Math.max(0, Math.floor((new Date(end).getTime() - new Date(start).getTime()) / 1000));
    }
    function formatDuration(seconds) {
      const minutes = Math.round(seconds / 60);
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return h === 0 ? m + "m" : h + "h " + String(m).padStart(2, "0") + "m";
    }
    function formatClock(value) {
      return new Intl.DateTimeFormat("de-DE", { hour: "2-digit", minute: "2-digit" }).format(new Date(value));
    }
    function formatDateTime(value) {
      return new Intl.DateTimeFormat("de-DE", {
        day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit"
      }).format(new Date(value));
    }
    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[char]));
    }
    function normalizeText(value) {
      return String(value || "").trim().toLowerCase();
    }
    function downloadJson(data, filename) {
      downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }), filename);
    }
    function sanitizeFolderName(name) {
      return (name || "Animationsprojekt").trim()
        .replace(/[<>:"/\\|?*\u0000-\u001F]/g, "-")
        .replace(/\s+/g, " ")
        .slice(0, 80) || "Animationsprojekt";
    }
    function getProjectFolderName(task) {
      return sanitizeFolderName(`AKT ${task.productionDeadline.slice(0, 10)} ${task.projectType} ${task.abbreviation || task.title}`);
    }
    function normalizeStatus(status) {
      if (status === "briefing" || status === "preparation") return "planning";
      if (status === "correction" || status === "render") return "approval";
      return ["planning", "animation", "approval", "delivered"].includes(status) ? status : "planning";
    }
    function normalizeTask(task) {
      return {
        id: task.id || uid(),
        title: task.title || "Animation",
        projectType: task.projectType || "ANIM",
        abbreviation: task.abbreviation || "",
        source: task.source || "Formular",
        requester: task.requester || "",
        description: task.description || "",
        sendSlot: task.sendSlot || "17:45",
        productionDeadline: task.productionDeadline || combineDeadline(toLocalDate(new Date()), "17:15"),
        workStatus: normalizeStatus(task.workStatus),
        activeTimer: task.activeTimer || null,
        sessions: task.sessions || [],
        createdAt: task.createdAt || new Date().toISOString(),
        updatedAt: task.updatedAt || task.completedAt || task.archivedAt || task.createdAt || new Date().toISOString(),
        completedAt: task.completedAt || null,
        archivedAt: task.archivedAt || null,
      };
    }
    function makeBackup() {
      return {
        app: "zeitmanagement",
        version: 4,
        exportedAt: new Date().toISOString(),
        tasks,
      };
    }
    function restoreBackup(data) {
      const importedTasks = Array.isArray(data) ? data : data && Array.isArray(data.tasks) ? data.tasks : null;
      if (!importedTasks) throw new Error("Keine Aufgaben gefunden.");
      tasks = archiveCompletedTasks(importedTasks.map(normalizeTask), new Date());
      save();
      render();
    }
    function loadSyncSettings() {
      try {
        return {
          enabled: localStorage.getItem(SYNC_KEY + ":enabled") === "true",
          token: localStorage.getItem(SYNC_KEY + ":token") || "",
        };
      } catch {
        return { enabled: false, token: "" };
      }
    }
    function saveSyncSettings(settings = syncSettings) {
      syncSettings = settings;
      localStorage.setItem(SYNC_KEY + ":enabled", settings.enabled ? "true" : "false");
      if (settings.token) localStorage.setItem(SYNC_KEY + ":token", settings.token);
      else localStorage.removeItem(SYNC_KEY + ":token");
    }
    function taskVersionMs(task) {
      const dates = [task.updatedAt, task.archivedAt, task.completedAt, task.createdAt]
        .concat((task.sessions || []).flatMap(session => [session.startedAt, session.endedAt]))
        .filter(Boolean)
        .map(value => new Date(value).getTime())
        .filter(Number.isFinite);
      return dates.length ? Math.max(...dates) : 0;
    }
    function mergeTasks(localList, remoteList) {
      const map = new Map();
      localList.map(normalizeTask).forEach(task => map.set(task.id, task));
      remoteList.map(normalizeTask).forEach(task => {
        const current = map.get(task.id);
        if (!current || taskVersionMs(task) >= taskVersionMs(current)) map.set(task.id, task);
      });
      return Array.from(map.values()).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    }
    function touch(task) {
      return { ...task, updatedAt: new Date().toISOString() };
    }
    function encodeBase64Utf8(value) {
      return btoa(unescape(encodeURIComponent(value)));
    }
    function decodeBase64Utf8(value) {
      return decodeURIComponent(escape(atob(value.replace(/\n/g, ""))));
    }
    function githubHeaders() {
      const headers = {
        Accept: "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
      };
      if (syncSettings.token) headers.Authorization = "Bearer " + syncSettings.token;
      return headers;
    }
    function githubFileUrl() {
      return `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_DATA_PATH}`;
    }
    async function readGithubStore() {
      const response = await fetch(githubFileUrl() + "?ref=" + encodeURIComponent(GITHUB_BRANCH), {
        headers: githubHeaders(),
      });
      if (response.status === 404) return { sha: null, tasks: [] };
      if (!response.ok) throw new Error("GitHub konnte nicht gelesen werden.");
      const file = await response.json();
      const data = JSON.parse(decodeBase64Utf8(file.content || ""));
      const remoteTasks = Array.isArray(data) ? data : data && Array.isArray(data.tasks) ? data.tasks : [];
      return { sha: file.sha, tasks: remoteTasks.map(normalizeTask) };
    }
    async function writeGithubStore() {
      if (!syncSettings.token) throw new Error("Zum Speichern fehlt der GitHub-Token.");
      const remote = await readGithubStore();
      const merged = mergeTasks(tasks, remote.tasks);
      const payload = {
        app: "zeitmanagement",
        version: 5,
        updatedAt: new Date().toISOString(),
        tasks: merged,
      };
      const response = await fetch(githubFileUrl(), {
        method: "PUT",
        headers: { ...githubHeaders(), "Content-Type": "application/json" },
        body: JSON.stringify({
          message: "Update Zeitmanagement data",
          content: encodeBase64Utf8(JSON.stringify(payload, null, 2)),
          branch: GITHUB_BRANCH,
          sha: remote.sha || undefined,
        }),
      });
      if (!response.ok) throw new Error("GitHub konnte nicht gespeichert werden.");
      tasks = archiveCompletedTasks(merged, new Date());
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      syncStatus = { tone: "ok", text: "GitHub gespeichert: " + formatClock(new Date()) };
    }
    async function loadFromGithub({ silent = false } = {}) {
      if (isSyncing) return;
      isSyncing = true;
      try {
        const remote = await readGithubStore();
        tasks = archiveCompletedTasks(mergeTasks(tasks, remote.tasks), new Date());
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        syncStatus = { tone: "ok", text: "GitHub geladen: " + formatClock(new Date()) };
        render();
      } catch (error) {
        syncStatus = { tone: "error", text: error.message };
        if (!silent) alert(error.message);
        render();
      } finally {
        isSyncing = false;
      }
    }
    async function saveToGithub({ silent = false } = {}) {
      if (isSyncing) return;
      isSyncing = true;
      try {
        await writeGithubStore();
        if (!silent) alert("GitHub wurde gespeichert.");
        render();
      } catch (error) {
        syncStatus = { tone: "error", text: error.message };
        if (!silent) alert(error.message);
        render();
      } finally {
        isSyncing = false;
      }
    }
    function queueGithubSync() {
      if (!syncSettings.enabled || !syncSettings.token) return;
      clearTimeout(syncTimer);
      syncStatus = { tone: "warn", text: "GitHub-Sync wartet..." };
      syncTimer = setTimeout(() => saveToGithub({ silent: true }), 900);
    }
    function loadTasks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("zeitmanagement-tool-v2") || localStorage.getItem("zeitmanagement-tool-v1");
        return raw ? JSON.parse(raw).map(normalizeTask) : [];
      } catch {
        return [];
      }
    }
    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      queueGithubSync();
    }
    function saveBackup() {
      downloadJson(makeBackup(), `zeitmanagement-backup-${toLocalDate(new Date())}.json`);
    }
    function loadBackupFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          restoreBackup(JSON.parse(String(reader.result || "")));
          alert("Backup wurde geladen.");
        } catch (error) {
          alert("Backup konnte nicht gelesen werden: " + error.message);
        }
      };
      reader.readAsText(file, "utf-8");
    }
    function archiveCompletedTasks(list, date = new Date()) {
      const today = toLocalDate(date);
      return list.map(task => {
        if (task.archivedAt || !task.completedAt || localDateFromIso(task.completedAt) >= today) return task;
        return touch({ ...task, archivedAt: date.toISOString() });
      });
    }
    function sumSessions(task, kind) {
      let seconds = (task.sessions || [])
        .filter(session => !kind || session.kind === kind)
        .reduce((sum, session) => sum + session.seconds, 0);
      if (task.activeTimer && (!kind || task.activeTimer.kind === kind)) {
        seconds += secondsBetween(task.activeTimer.startedAt);
      }
      return seconds;
    }
    function average(list, kind) {
      const values = list.map(task => sumSessions(task, kind)).filter(Boolean);
      if (!values.length) return "-";
      return formatDuration(values.reduce((sum, value) => sum + value, 0) / values.length);
    }
    function averageForSimilar(title, kind) {
      const words = normalizeText(title).split(/\s+/).filter(word => word.length > 3);
      const finished = completedTasks().concat(archivedTasks());
      const similar = finished.filter(task => words.some(word => normalizeText(task.title).includes(word)));
      const source = similar.length >= 2 ? similar : finished;
      return average(source, kind);
    }
    function risk(task) {
      if (task.completedAt || task.workStatus === "delivered") return "done";
      const remaining = Math.floor((new Date(task.productionDeadline).getTime() - now.getTime()) / 1000);
      if (remaining <= 0) return "late";
      if (remaining <= 15 * 60) return "critical";
      if (remaining <= 30 * 60) return "tight";
      return "ok";
    }
    function riskLabel(value) {
      return { done: "Fertig", late: "Überfällig", critical: "Kritisch", tight: "Knapp", ok: "Im Plan" }[value] || "Im Plan";
    }
    function closeTimer(task) {
      if (!task.activeTimer) return task;
      const endedAt = new Date().toISOString();
      return {
        ...task,
        activeTimer: null,
        updatedAt: endedAt,
        sessions: [...task.sessions, {
          id: uid(),
          kind: task.activeTimer.kind,
          startedAt: task.activeTimer.startedAt,
          endedAt,
          seconds: secondsBetween(task.activeTimer.startedAt, endedAt),
        }],
      };
    }
    function activeTasks() {
      return tasks
        .filter(task => !task.archivedAt && !task.completedAt && task.workStatus !== "delivered")
        .sort((a, b) => new Date(a.productionDeadline) - new Date(b.productionDeadline));
    }
    function completedTasks() {
      return tasks.filter(task => !task.archivedAt && (task.completedAt || task.workStatus === "delivered"));
    }
    function archivedTasks() {
      return tasks.filter(task => task.archivedAt);
    }
    function archiveWorkday() {
      const stamp = new Date().toISOString();
      let changed = false;
      tasks = tasks.map(task => {
        if (task.archivedAt || !task.completedAt) return task;
        changed = true;
        return touch({ ...task, archivedAt: stamp });
      });
      if (changed) save();
      render();
      alert(changed ? "Fertige Aufgaben wurden archiviert." : "Keine fertigen Aufgaben zum Archivieren gefunden.");
    }
    function renderMetric(label, value) {
      return `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`;
    }
    function render() {
      const active = activeTasks();
      const completed = completedTasks();
      const today = toLocalDate(now);
      const todaysTasks = tasks.filter(task => localDateFromIso(task.createdAt) === today);
      document.getElementById("metrics").innerHTML = [
        renderMetric("Aktive Jobs", active.length),
        renderMetric("Heute erfasst", formatDuration(todaysTasks.reduce((sum, task) => sum + sumSessions(task), 0))),
        renderMetric("Vorbereitung", formatDuration(todaysTasks.reduce((sum, task) => sum + sumSessions(task, "preparation"), 0))),
        renderMetric("in Arbeit", formatDuration(todaysTasks.reduce((sum, task) => sum + sumSessions(task, "animation"), 0))),
      ].join("");
      document.getElementById("learning").innerHTML = `
        <div><span>Durchschnitt Vorbereitung</span><strong>${average(completed.concat(archivedTasks()), "preparation")}</strong></div>
        <div><span>Durchschnitt in Arbeit</span><strong>${average(completed.concat(archivedTasks()), "animation")}</strong></div>
        <div><span>Abgeschlossene Jobs</span><strong>${completed.length + archivedTasks().length}</strong></div>
      `;
      document.querySelectorAll(".switch button").forEach(button => button.classList.toggle("active", button.dataset.view === view));
      if (view === "timeline") renderTimeline();
      else if (view === "analysis") renderAnalysis();
      else if (view === "archive") renderArchive();
      else if (view === "settings") renderSettings();
      else renderBoard();
    }
    function renderBoard() {
      document.getElementById("view").innerHTML = `<div class="board">${COLUMNS.map(([key, title]) => {
        const columnTasks = tasks.filter(task => !task.archivedAt && task.workStatus === key)
          .sort((a, b) => new Date(a.productionDeadline) - new Date(b.productionDeadline));
        return `<section class="column" data-column="${key}">
          <div class="column-head"><h2>${title}</h2><span>${columnTasks.length}</span></div>
          <div class="stack">${columnTasks.length ? columnTasks.map(renderCard).join("") : '<div class="empty">Leer</div>'}</div>
        </section>`;
      }).join("")}</div>`;
    }
    function renderCard(task) {
      const remaining = Math.floor((new Date(task.productionDeadline).getTime() - now.getTime()) / 1000);
      const state = risk(task);
      const primaryTimerKind = task.workStatus === "planning" ? "preparation" : "animation";
      const primaryTimerActive = task.activeTimer && task.activeTimer.kind === primaryTimerKind;
      const animationActive = task.activeTimer && task.activeTimer.kind === "animation";
      const preparationActive = task.activeTimer && task.activeTimer.kind === "preparation";
      return `<article class="card ${state}" draggable="true" data-id="${task.id}">
        <div class="card-main">
          <div class="card-title-row">
            <h3>${escapeHtml(task.title)}</h3>
          </div>
          <div class="card-focus">
            <div class="time-left">
              <span>${riskLabel(state)}</span>
              <strong>${remaining > 0 ? formatDuration(remaining) : "0m"}</strong>
            </div>
            <div class="play-cluster">
              <button
                class="play-button ${primaryTimerActive ? "active" : ""}"
                data-action="timer"
                data-kind="${primaryTimerKind}"
                data-id="${task.id}"
                title="${primaryTimerActive ? "Zeiterfassung stoppen" : "Zeiterfassung starten"}"
                aria-label="${primaryTimerActive ? "Zeiterfassung stoppen" : "Zeiterfassung starten"}"
              >
                ${primaryTimerActive ? "Stop" : "Start"}
              </button>
            </div>
          </div>
          <div class="card-subline">
            <span title="Sendung" aria-label="Sendung"><span class="mono-icon screen"></span>${task.sendSlot}</span>

    function renderTimeline() {
      const hours = Array.from({ length: DAY_END - DAY_START + 1 }, (_, index) => DAY_START + index);
      const totalMinutes = (DAY_END - DAY_START) * 60;
      const nowPosition = ((now.getHours() * 60 + now.getMinutes() - DAY_START * 60) / totalMinutes) * 100;
      const rows = activeTasks().map(task => {
        const deadline = new Date(task.productionDeadline);
        const deadlineMinutes = deadline.getHours() * 60 + deadline.getMinutes();
        const created = new Date(task.createdAt);
        const createdMinutes = created.getHours() * 60 + created.getMinutes();
        const startMinutes = Math.max(DAY_START * 60, Math.min(createdMinutes, deadlineMinutes));
        const left = ((startMinutes - DAY_START * 60) / totalMinutes) * 100;
        const width = ((deadlineMinutes - startMinutes) / totalMinutes) * 100;
        const [sendHour, sendMinute] = task.sendSlot.split(":").map(Number);
        const sendLeft = (((sendHour * 60 + sendMinute) - DAY_START * 60) / totalMinutes) * 100;
        const deadlineLeft = ((deadlineMinutes - DAY_START * 60) / totalMinutes) * 100;
        const state = risk(task);
        return `<div class="timeline-row">
          <div class="time-label"><strong>${escapeHtml(task.title)}</strong><span>${formatDuration(sumSessions(task))} erfasst</span></div>
          <div class="track">
            <div class="bar ${state}" style="left:${left}%;width:${Math.max(width, 8)}%">${riskLabel(state)}</div>
            <span class="pin" style="left:${deadlineLeft}%">Deadline ${formatClock(task.productionDeadline)}</span>
            <span class="pin send" style="left:${sendLeft}%">Sendung ${task.sendSlot}</span>

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;
      for (let index = 0; index < text.length; index += 1) {
        const char = text[index];
        const next = text[index + 1];
        if (char === '"' && quoted && next === '"') {
          value += '"';
          index += 1;
        } else if (char === '"') {
          quoted = !quoted;
        } else if ((char === "," || char === ";") && !quoted) {
          row.push(value.trim());
          value = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") index += 1;
          row.push(value.trim());
          if (row.some(Boolean)) rows.push(row);
          row = [];
          value = "";
        } else {
          value += char;
        }
      }
      row.push(value.trim());
      if (row.some(Boolean)) rows.push(row);
      return rows;
    }
    function pickField(row, headers, names) {
      for (const name of names) {
        const index = headers.findIndex(header => normalizeText(header) === normalizeText(name));
        if (index >= 0 && row[index]) return row[index];
      }
      return "";
    }
    function parseDateInput(value) {
      const raw = String(value || "").trim();
      if (!raw) return toLocalDate(new Date());
      const german = raw.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
      if (german) {
        const year = german[3].length === 2 ? "20" + german[3] : german[3];
        return `${year}-${String(german[2]).padStart(2, "0")}-${String(german[1]).padStart(2, "0")}`;
      }
      const parsed = new Date(raw);
      if (!Number.isNaN(parsed.getTime())) return toLocalDate(parsed);
      return toLocalDate(new Date());
    }
    function parseTimeInput(value, fallback = "17:15") {
      const raw = String(value || "").trim();
      const match = raw.match(/(\d{1,2})[:.](\d{2})/);
      if (!match) return fallback;
      return `${String(match[1]).padStart(2, "0")}:${match[2]}`;
    }
    function mapStatus(value) {
      const text = normalizeText(value);
      if (text.includes("arbeit") || text.includes("progress")) return "animation";
      if (text.includes("abnahme") || text.includes("review")) return "approval";
      if (text.includes("fertig") || text.includes("bereit") || text.includes("done") || text.includes("complete")) return "delivered";
      return "planning";
    }
    function importCsvFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const rows = parseCsv(String(reader.result || ""));
          if (rows.length < 2) throw new Error("Die Datei enthält keine Aufgaben.");
          const headers = rows[0];
          const imported = rows.slice(1).map(row => {
            const title = pickField(row, headers, ["Aufgabe", "Titel", "Title", "Task", "Name"]) || "Importierte Aufgabe";
            const date = parseDateInput(pickField(row, headers, ["Deadline-Datum", "Fälligkeitsdatum", "Due date", "Due", "Datum"]));
            const time = parseTimeInput(pickField(row, headers, ["Deadline-Zeit", "Uhrzeit", "Time", "Deadline"]), "17:15");
            const sendSlot = parseTimeInput(pickField(row, headers, ["Sendezeit", "Sendung", "Sendetermin"]), "17:45");
            const status = mapStatus(pickField(row, headers, ["Bucket", "Status", "Spalte", "Progress"]));
            return normalizeTask({
              id: uid(),
              title,
              projectType: pickField(row, headers, ["Typ", "Type"]) || "ANIM",
              abbreviation: pickField(row, headers, ["Kürzel", "Kuerzel", "Code"]).toUpperCase(),
              source: "Teams",
              requester: pickField(row, headers, ["Auftrag von", "Auftraggeber", "Assigned to", "Zugewiesen an"]),
              description: pickField(row, headers, ["Notiz", "Beschreibung", "Description", "Notes"]),
              sendSlot,
              productionDeadline: combineDeadline(date, time),
              workStatus: status,
              activeTimer: null,
              sessions: [],
              createdAt: new Date().toISOString(),
              updatedAt: new Date().toISOString(),
              completedAt: status === "delivered" ? new Date().toISOString() : null,
              archivedAt: null,
            });
          });
          let added = 0;
          imported.forEach(task => {
            const duplicate = tasks.some(existing =>
              normalizeText(existing.title) === normalizeText(task.title) &&
              existing.productionDeadline === task.productionDeadline
            );
            if (!duplicate) {
              tasks.unshift(task);
              added += 1;
            }
          });
          save();
          render();
          alert(`${added} Aufgaben importiert. ${imported.length - added} Duplikate übersprungen.`);
        } catch (error) {
          alert("CSV konnte nicht importiert werden: " + error.message);
        }
      };
      reader.readAsText(file, "utf-8");
    }

        const key = `${task.id}-${state}-${minutesLeft}`;

    }

        const enabled = document.getElementById("syncEnabled").checked;
        saveSyncSettings({ token, enabled });
        syncStatus = { tone: "ok", text: enabled && token ? "GitHub-Sync aktiv." : "GitHub-Verbindung gespeichert." };
        render();
      }
      if (event.target.id === "loadGithub") loadFromGithub();
      if (event.target.id === "saveGithub") saveToGithub();
    });
    document.getElementById("view").addEventListener("input", event => {
      if (event.target.id !== "analysisSearch") return;
      analysisQuery = event.target.value;
      renderAnalysis();
    });
    document.getElementById("view").addEventListener("toggle", event => {
      const details = event.target.closest("details[data-details-id]");
      if (!details) return;
      if (details.open) openDetailIds.add(details.dataset.detailsId);
      else openDetailIds.delete(details.dataset.detailsId);
    }, true);
    document.getElementById("view").addEventListener("dragstart", event => {
      const card = event.target.closest(".card");
      if (card) {
        draggingTaskId = card.dataset.id;
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/task-id", card.dataset.id);
      }
    });
    document.getElementById("view").addEventListener("dragend", () => {
      draggingTaskId = null;
    });
    document.getElementById("view").addEventListener("dragover", event => {
      if (event.target.closest(".column")) event.preventDefault();
    });
    document.getElementById("view").addEventListener("drop", event => {
      const column = event.target.closest(".column");
      if (!column) return;
      event.preventDefault();
      const id = event.dataTransfer.getData("text/task-id") || draggingTaskId;
      draggingTaskId = null;
      if (id) moveTask(id, column.dataset.column);
    });
    setInterval(() => {
      now = new Date();
      const today = toLocalDate(now);
      if (today !== lastArchiveDate) {
        lastArchiveDate = today;
        tasks = archiveCompletedTasks(tasks, now);
        save();
      }
      warnCritical();
      if (draggingTaskId) return;
      render();
    }, 1000);

    renderSlots();
    updateNotificationButton("Notification" in window ? Notification.permission : "default");
    render();
    loadFromGithub({ silent: true });
  </script>
</body>
</html>
